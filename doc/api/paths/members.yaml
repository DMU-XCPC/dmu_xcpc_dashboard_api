memberActivity:
  get:
    tags:
      - members
    operationId: getMemberActivity
    summary: 获取成员活动度
    description: |
      **权限**：需要 `member:read`；缺少该 scope 返回 `403 insufficient_scope`。

      **语义**：返回活动度的派生视图。`window` 只影响 `active_days_30d`、
      `solved_count_30d`、`submissions_30d` 三个统计字段的回看窗口，默认 `P90D`，
      最大 `P730D`，字段名中的 `_30d` 保持不变；`activity_state` 恒按
      ≤90/≤365/>365 天的固定口径计算，不受 `window` 影响。

      **时序**：派生数据由后台汇总任务写入，可能滞后于已接受的写入，**滞后上界 15 分钟**；
      `computed_at` 给出本次派生值的计算时刻，客户端应据此展示"数据截至时间"。
      刚发生的登录/OJ 提交可能需要等到下一次汇总才出现。

      **副作用**：无，只读。**幂等**：是。**缓存**：可缓存，见 `x-cacheable`，
      但客户端应尊重 `computed_at` 而非本地时钟。

      **错误分支**：`window` 不是合法 ISO-8601 时长或超过 `P730D` → `400 bad_request`；
      成员不存在或不可见 → `404 not_found`。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: member_id
        in: path
        required: true
        description: '主体 id，前缀 `acc_`，与 `account_id` 同一标识空间——成员没有独立 id。'
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - name: window
        in: query
        required: false
        description: |
          统计回看窗口（ISO-8601 时长），默认 `P90D`，最大 `P730D`；
          超出上限或格式非法返回 `400 bad_request`。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Duration
          default: P90D
        example: P90D
    responses:
      '200':
        description: 成员活动度。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/roster.yaml#/components/schemas/MemberActivity
            example:
              by_club:
                - club: acm_icpc
                  status: active
                  registered_at: '2024-03-01'
                  last_active_at: '2024-05-06T07:08:09.123Z'
                  active_days: 21
                  submissions: 84
              last_active_at: '2024-05-06T07:08:09.123Z'
              last_login_at: '2024-05-06T07:00:00.000Z'
              last_api_use_at: '2024-05-06T07:08:09.123Z'
              last_oj_activity_at: '2024-05-05T18:20:00.000Z'
              activity_state: active
              active_days_30d: 21
              solved_count_30d: 37
              submissions_30d: 84
              computed_at: '2024-05-06T07:10:00.000Z'
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT15M
    x-cacheable: true
