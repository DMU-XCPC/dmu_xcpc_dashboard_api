          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
      - $ref: ../components/parameters/common.yaml#/components/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/roster.yaml#/components/schemas/SetMemberClubsRequest
          example:
            memberships:
              - club: acm_icpc
                status: active
                registered_at: '2024-03-01'
                role: 成员
    responses:
      '200':
        description: 更新后的成员详情，`clubs` 为替换后的有效社团集合。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
