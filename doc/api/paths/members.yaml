              username: alice
              display_name: 张三
              kind: human
              labels:
                - member
              scopes:
                - account:self
                - member:read
              profile:
                student_id: '2220210000'
                enrollment_year: 2022
                club_memberships:
                  - club: acm_icpc
                    status: active
                    registered_at: '2024-03-01'
