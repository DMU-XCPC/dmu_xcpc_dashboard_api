memberLabels:
  put:
    tags:
      - members
    operationId: setMemberLabels
    summary: 替换成员标签
    description: |
      **权限**：需要 `member:assign`（标签本身不授予权限，但决定成员名单归属，
      因此与 scope 同级别管理）。

      **语义**：**全量替换**成员标签集合，不是增量。请求中的 `labels` 即替换后的
      最终状态（服务端去重）。

      **副作用**：只改变标签本身，**不会**改变成员资格。`clubs` 由社团注册记录决定，
      因此增删标签不会让人进出名单，只会改变按标签筛选的结果；要让某人退出某个社团，
      用 `PUT /members/{member_id}/clubs` 把该社团置为 `alumni` 或不提交。

      **并发**：支持 `If-Match` + `revision`；不匹配返回 `412 precondition_failed`。
      省略时为 last-write-wins。**幂等**：必须携带 `Idempotency-Key`；重复提交同一
      集合结果收敛（但每次都会推进 `revision`）。

      **时序**：强一致，响应中的 `labels` 即本次写入后的状态。写审计记录。

      **错误分支**：标签格式非法（小写、长度 1..40、字符集受限）→ `422 validation_failed`；
      成员不存在 → `404 not_found`。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: member_id
        in: path
        required: true
        description: '主体 id，前缀 `acc_`，与 `account_id` 同一标识空间——成员没有独立 id。'
