memberScopes:
  put:
    tags:
      - members
    operationId: setMemberScopes
    summary: 替换成员权限
    description: |
      **权限**：需要 `member:assign`；缺少该 scope 返回 `403 insufficient_scope`。

      **语义**：**全量替换**成员的 scope 集合，不是增量。请求中的 `scopes` 即替换后的
      最终状态（服务端去重）。

      **提权限制**：调用者**不得授予自己不持有的 scope**——请求中任一 scope
      超出调用者自身的有效 scope 集合，按 `*` 与 `<资源>:*` 展开后比较时，
      整个请求返回 `403 insufficient_scope`，**不做部分授予**。回收权限不受此限制，
      但不能回收调用者自身凭证所需的 scope（否则 `403 forbidden`）。

      **并发**：支持 `If-Match` + `revision`；不匹配返回 `412 precondition_failed`。

      **幂等**：必须携带 `Idempotency-Key`。**副作用**：立即影响该主体后续请求的授权
      判定与现有 `session` 凭证的生效 scope（传播延迟 ≤60 秒，见 README）；写审计记录。

      **时序**：响应返回时新 scope 已持久化，但已在飞行中的请求可能仍按旧 scope 通过
      （传播上界 60 秒）。**错误分支**：未知资源前缀/动作 → `422 validation_failed`；
      成员不存在 → `404 not_found`。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: member_id
        in: path
        required: true
        description: '主体 id，前缀 `acc_`，与 `account_id` 同一标识空间——成员没有独立 id。'
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
      - $ref: ../components/parameters/common.yaml#/components/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/roster.yaml#/components/schemas/SetMemberScopesRequest
          example:
            scopes:
              - account:self
              - member:read
              - oj:read
    responses:
      '200':
        description: 更新后的成员详情（`scopes` 为替换后的完整集合）。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
