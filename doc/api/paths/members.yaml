memberClubs:
  put:
    tags:
      - members
    operationId: setMemberClubs
    summary: 替换成员的社团身份
    description: |
      **用途**：登记或修改某人属于哪些社团。集训队挂靠海风社团软件部 Safewind 与 ACM/ICPC 学社
      两个社团，成员可以只注册其中一个，也可以两个都注册，本接口整体替换这两条注册记录。

      **权限**：需要 `member:manage`，与维护档案同级。

      **语义**：**整体替换**，不是增量。请求里的 `memberships` 即替换后的完整集合：
      未出现的社团会被置为 `alumni` 并保留 `registered_at`，不会删除记录，以便历史留档；
      同一社团重复出现返回 `422 validation_failed`。传空数组表示两个社团都退出，
      该成员随即从 `GET /members` 的社团筛选里消失，但主体、凭证与历史数据都保留。

      **副作用**：立即改变 `Member.clubs`，并改变 `Member.activity.by_club` 的统计口径
      （按社团只统计在册期间的活跃）；写审计记录。

      **并发**：支持 `If-Match` + `revision`；不匹配返回 `412 precondition_failed`。
      **幂等**：必须携带 `Idempotency-Key`；重复提交同一集合结果收敛，但每次都会推进 `revision`。

      **错误分支**：`club` 不在枚举内、`registered_at` 格式非法、`ended_at` 早于
      `registered_at` → `422 validation_failed`；成员不存在 → `404 not_found`。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: member_id
        in: path
        required: true
        description: '主体 id（`acc_` 前缀；与 `account_id` 同一标识空间——成员没有独立 id）。'
