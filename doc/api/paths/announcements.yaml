announcementBroadcast:
  post:
    tags:
      - announcements
    operationId: broadcastAnnouncement
    summary: 广播公告到渠道，异步执行
    description: |
      把公告投递到指定广播渠道。**未发布的公告也允许广播**（用于提前通知），
      广播不会改变公告的状态；`test=true` 时只投递到处于测试模式的渠道，
      且不计入正式投递统计。

      **权限**：`channel:manage`（广播会向外部渠道发送消息）。

      **时序**：立即返回 `202 Accepted` 与 `Location: /jobs/{job_id}`
      ，kind 为 `announcement_broadcast`；投递结果异步产生，逐条状态见
      `GET /announcements/{announcement_id}/deliveries`，公告的 `delivery_summary`
      随之更新。客户端应按 `Retry-After` 轮询任务或订阅 `announcements` 主题的
      `delivery.failed` 事件。

      **冲突**：同一公告已有正在运行的广播任务时返回 `409 conflict`
      （避免重复轰炸渠道）；`Idempotency-Key` 的网络重放返回首次的 `202`，
      不会重复创建任务。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: announcement_id
        in: path
        required: true
        description: 公告 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: ann_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/news.yaml#/components/schemas/BroadcastAnnouncementRequest
          example:
            channel_ids:
              - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
            test: false
    responses:
      '202':
        description: 广播任务已接受；按 `Location` 轮询任务状态。
        headers:
          Location:
            $ref: ../components/headers/common.yaml#/components/headers/Location
          Retry-After:
            $ref: ../components/headers/common.yaml#/components/headers/RetryAfter
          Idempotency-Replayed:
            $ref: ../components/headers/common.yaml#/components/headers/IdempotencyReplayed
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/components/schemas/Job
            example:
              id: job_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              kind: announcement_broadcast
              state: queued
              progress:
                percent: 0
                message: 等待投递 2 个渠道
              result: null
              error: null
              created_at: '2024-05-06T07:08:09.123Z'
              started_at: null
              finished_at: null
              expires_at: null
              created_by:
                id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                username: qq-bot
                display_name: QQ 机器人
                kind: service
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/components/responses/Conflict
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
