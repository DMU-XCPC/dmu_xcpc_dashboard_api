    operationId: unpublishAnnouncement
    summary: 撤销发布，退回草稿
    description: |
      把 `published` 或 `scheduled` 的公告退回 `draft`：`published_at` 清空、
      `publish_at` 清空，新闻板立即不再展示，并发出 `announcement.updated`
      SSE 事件。已完成的广播投递不会被撤销。

      **权限**：`announcement:publish`。

      **幂等**：对 `draft` 公告重复调用返回 `200` 且状态不变；
      `archived` 或 `expired` 公告返回 `409 conflict`（终态不可回到草稿，
      归档公告如需移除请用 `DELETE ...?purge=true`）。
