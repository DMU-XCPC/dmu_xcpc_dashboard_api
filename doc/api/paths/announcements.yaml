announcementPublish:
  post:
    tags:
      - announcements
    operationId: publishAnnouncement
    summary: 发布公告，可定时
    description: |
      把公告推进到 `published` 或 `scheduled`。

      **权限**：`announcement:publish`。

      **时序**：`publish_at` 为空或已过去 → 立即 `published` 并发出
      `announcement.published` SSE 事件；`publish_at` 为未来时刻 → `scheduled`，
      到点由服务器自动发布（客户端无需轮询）。带 `broadcast=true` 时，发布/定时发布
      触发广播任务，需要额外的 `channel:manage`。

      **幂等**：对**已发布**公告重复调用返回 `200` 且状态不变；此时 `publish_at`
      不可再修改（尝试修改返回 `409 conflict`）。`archived`/`expired` 公告不可发布，
      返回 `409 conflict`。携带 `Idempotency-Key` 的网络重放返回首次响应，
      不会重复广播。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: announcement_id
        in: path
        required: true
        description: 公告 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: ann_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/news.yaml#/components/schemas/PublishAnnouncementRequest
          example:
            publish_at: '2024-05-07T00:00:00.000Z'
            broadcast: true
            channel_ids:
              - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
    responses:
      '200':
        description: 发布后的公告（状态为 `published` 或 `scheduled`）。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
          Idempotency-Replayed:
            $ref: ../components/headers/common.yaml#/components/headers/IdempotencyReplayed
        content:
