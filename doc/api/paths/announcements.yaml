announcement:
  get:
    tags:
      - announcements
    operationId: getAnnouncement
    summary: 获取单个公告
    description: |
      读取公告详情。

      **可见性**：与列表一致——匿名（在 `capabilities.public_read=true` 时）只能读取
      `visibility` 为 `public`/`members` 且 `status=published` 的公告；`status=draft`
      或 `visibility=private` 的公告对无权者返回 `404 not_found`，而不是 403，
      避免通过状态码枚举出草稿的存在。

      **缓存**：响应带强 `ETag`（等于 `revision`）；`If-None-Match` 命中返回 `304`，
      正文修改，含已发布公告会改变 `revision` 与 `ETag`。
    security:
      - {}
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: announcement_id
        in: path
        required: true
        description: 公告 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: ann_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: 公告详情。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
          Cache-Control:
            description: 匿名可读公告允许短时公共缓存；私有/草稿为 `private, no-store`。
            schema:
              type: string
            example: public, max-age=60
        content:
          application/json:
            schema:
              $ref: ../components/schemas/news.yaml#/components/schemas/Announcement
            example:
              id: ann_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              title: 2024 暑期集训安排
              body_markdown: '## 时间：7 月 8 日起每周一、三、五 14:00 在 A301 训练。'
              category: training
              tags:
                - 训练
              priority: normal
              pinned: true
              status: published
              visibility: members
              publish_at: null
              published_at: '2024-05-06T07:08:09.123Z'
              expires_at: null
              archived_at: null
              source:
                kind: manual
              dedup_key: null
              broadcast_on_publish: false
              broadcast_channel_ids: []
              author: null
              created_by:
                id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                username: alice
                display_name: 张三
                kind: human
              delivery_summary: null
              created_at: '2024-05-06T07:00:00.000Z'
              updated_at: '2024-05-06T07:08:09.123Z'
              revision: '3'
      '304':
        $ref: ../components/responses/common.yaml#/components/responses/NotModified
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong
    x-cacheable: true
  patch:
    tags:
      - announcements
    operationId: updateAnnouncement
    summary: 局部更新公告
    description: |
      修改公告的标题、正文、分类、标签、优先级、置顶、可见性、定时/过期时间与广播目标。

      **权限**：`announcement:write`。修改广播目标（`broadcast`/`channel_ids`）需要
      `channel:manage`。改 `pinned` 时受 `announcements.max_pinned` 限制，超限返回
      `409 conflict`。

      **已发布公告可改正文**：允许，且会提升 `revision` 并向 SSE 推送
      `announcement.updated` 事件（`data` 含新 `revision`），订阅方据此刷新本地副本。
      但 `publish_at` 在 `published` 状态下不可再改（返回 `409 conflict`）。

      **并发控制**：带 `If-Match` 时以 `revision` 做乐观锁，不匹配返回
      `412 precondition_failed`；不带 `If-Match` 时以"最后写入胜出"处理。
      携带 `Idempotency-Key` 的网络重放返回首次响应，不会重复提升 `revision`。

      **副作用**：修改广播目标只影响**后续**发布/广播，不会自动重发已发出的投递。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: announcement_id
        in: path
        required: true
        description: 公告 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: ann_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IfMatch
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/news.yaml#/components/schemas/UpdateAnnouncementRequest
          example:
            body_markdown: '## 时间：改为 7 月 9 日起每周二、四 14:00 在 A301 训练。'
            tags:
              - 训练
              - 通知
            pinned: true
    responses:
      '200':
        description: 更新后的公告；`revision` 已提升，`ETag` 为最新值。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
          Idempotency-Replayed:
            $ref: ../components/headers/common.yaml#/components/headers/IdempotencyReplayed
        content:
          application/json:
            schema:
              $ref: ../components/schemas/news.yaml#/components/schemas/Announcement
            example:
              id: ann_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              title: 2024 暑期集训安排
              body_markdown: '## 时间：改为 7 月 9 日起每周二、四 14:00 在 A301 训练。'
              category: training
              tags:
                - 训练
                - 通知
              priority: normal
              pinned: true
              status: published
              visibility: members
              publish_at: null
              published_at: '2024-05-06T07:08:09.123Z'
              expires_at: null
              archived_at: null
              source:
                kind: manual
              dedup_key: null
              broadcast_on_publish: true
              broadcast_channel_ids:
                - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              author: null
              created_by:
                id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                username: alice
                display_name: 张三
                kind: human
              delivery_summary:
                pending: 0
                sent: 2
                failed: 1
              created_at: '2024-05-06T07:00:00.000Z'
              updated_at: '2024-05-06T07:30:00.000Z'
              revision: '4'
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/components/responses/Conflict
      '412':
        $ref: ../components/responses/common.yaml#/components/responses/PreconditionFailed
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong
  delete:
    tags:
      - announcements
    operationId: deleteAnnouncement
    summary: 删除公告，默认归档
    description: |
      **默认行为是归档而不是物理删除**：`status` 置为 `archived`（终态，不可逆），
      历史投递记录与审计保留，新闻板不再展示。归档需要 `announcement:write`。

      `purge=true` 时执行**物理删除**：资源、投递记录与统计一并清除，不可恢复；
      该模式需要 `announcement:publish`，否则返回 `403 insufficient_scope`。

      **幂等**：重复调用总是返回 `204`——已归档的公告再次归档、已删除的公告再次
      删除都不报错（`404` 仅在 id 从未存在时返回）。

      **副作用**：归档/删除不会撤销已完成的广播投递（消息已在群里），
      但会终止尚未投递的排队投递（其 `state` 变为 `skipped`）。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: announcement_id
        in: path
