announcements:
  get:
    tags:
      - announcements
    operationId: listAnnouncements
    summary: 列出新闻板公告
    description: |
      按过滤条件分页列出公告，新闻板首页与机器人拉取都走本端点。

      **权限与可见性**：分三档。
      匿名请求只在服务器 `capabilities.public_read=true` 时被接受，且只能看到
      `status=published` 且 `visibility=public` 的公告；已认证但缺少 `announcement:read`
      的主体可以额外看到 `visibility=members` 的公告；具备 `announcement:read`（或 `announcement:publish`）的主体可以看到
      `draft`、`scheduled`、`expired`、`archived` 与 `visibility=private` 的公告。
      过滤条件不会"提权"：`status=draft` 对无权者返回空集合而不是 403。

      **过滤**：`status`、`category`、`tag`，可重复，命中任一、`pinned`、`q`
      （标题与正文模糊匹配）、`published_after`、`updated_since`
      （严格晚于给定时时刻，用于增量同步）。

      **排序**：`sort` 支持 `published_at`，默认，未发布公告排在最后、`created_at`、
      `updated_at`、`priority`（`low < normal < high < urgent`），方向由 `order` 决定。
      置顶公告始终排在非置顶之前，与 `sort` 无关。

      **缓存**：结果可安全缓存（`x-cacheable`），但使用 `updated_since` 增量模式时
      响应不可用 `ETag` 复用。
    security:
      - {}
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: status
        in: query
        required: false
        description: 按状态过滤；对无权读取该状态的主体等同于过滤掉全部条目。
        schema:
          $ref: ../components/schemas/news.yaml#/components/schemas/AnnouncementStatus
        example: published
      - name: category
        in: query
        required: false
        description: 按分类精确过滤。
        schema:
          type: string
          minLength: 1
          maxLength: 40
        example: training
      - name: tag
        in: query
        required: false
        style: form
        explode: true
        description: 按标签过滤；可重复传参（`?tag=训练&tag=通知`），命中任一标签即返回。
        schema:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 40
        example:
          - 训练
      - name: pinned
        in: query
        required: false
        description: 只返回置顶公告传 `true`，只返回非置顶公告传 `false`；省略时不过滤。
        schema:
          type: boolean
        example: true
      - name: q
        in: query
        required: false
        description: 标题与正文的模糊搜索关键字；对 Markdown 源码做大小写不敏感匹配。
        schema:
          type: string
          minLength: 1
          maxLength: 100
        example: 集训
      - name: published_after
        in: query
        required: false
        description: 只返回 `published_at` **严格晚于**该时刻的已发布公告。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Timestamp
        example: '2024-05-01T00:00:00.000Z'
      - $ref: ../components/parameters/common.yaml#/components/parameters/UpdatedSince
      - name: sort
        in: query
        required: false
        description: |
          排序键。`priority` 按 `low < normal < high < urgent` 排序；
          `published_at` 时未发布公告排在最后（nulls last）。
        schema:
          type: string
          enum:
            - published_at
            - created_at
            - updated_at
            - priority
          default: published_at
        example: published_at
      - $ref: ../components/parameters/common.yaml#/components/parameters/Order
      - $ref: ../components/parameters/common.yaml#/components/parameters/Page
      - $ref: ../components/parameters/common.yaml#/components/parameters/Size
    responses:
      '200':
        description: 公告分页结果；`items` 只包含调用者可见的公告。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/news.yaml#/components/schemas/PagedAnnouncement
            example:
              page: 1
              size: 20
              total: 1
              has_next: false
              items:
                - id: ann_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  title: 2024 暑期集训安排
                  body_markdown: '## 时间：7 月 8 日起每周一、三、五 14:00 在 A301 训练。'
                  category: training
                  tags:
                    - 训练
                    - 通知
                  priority: normal
                  pinned: true
                  status: published
                  visibility: members
                  publish_at: null
                  published_at: '2024-05-06T07:08:09.123Z'
                  expires_at: null
                  archived_at: null
                  source:
                    kind: manual
                  dedup_key: null
                  broadcast_on_publish: true
                  broadcast_channel_ids:
                    - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  author: null
                  created_by:
                    id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                    username: alice
                    display_name: 张三
                    kind: human
                  delivery_summary:
                    pending: 0
                    sent: 2
                    failed: 1
                  created_at: '2024-05-06T07:00:00.000Z'
                  updated_at: '2024-05-06T07:08:09.123Z'
                  revision: '3'
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong
    x-cacheable: true
  post:
    tags:
      - announcements
    operationId: createAnnouncement
    summary: 创建公告，供 Agent 与机器人主动推送
    description: |
      外部 Agent、QQ 机器人与采集脚本**主动推送**通知的入口；推送即入库，
      **没有审核队列**：是否需要人工复核由推送方自行负责。

      **权限**：需要 `announcement:write`。`publish=true` 时**额外**需要
      `announcement:publish`，否则返回 `403 insufficient_scope`（不会静默降级为草稿）；
      `broadcast=true` 时还需要 `channel:manage`。

      **状态与时序**：
      `publish=false`，默认→ 公告以 `draft` 落库，仅具备 `announcement:read`
      权限的主体可见；
      `publish=true` 且 `publish_at` 为空或已过去 → 立即 `published`，并发出
      `announcement.published` SSE 事件；
      `publish=true` 且 `publish_at` 为未来时刻 → `scheduled`，到点由服务器自动发布，
      客户端无需轮询。
      `expires_at` 到点后服务器自动把 `published` 置为 `expired`。

      **去重与幂等**：带 `dedup_key` 时，在**7 天**窗口内按 `(dedup_key 作用域, title,
      body)` 判定重复——
      - `201`：本次确实新建；
      - `200`：同一个 `dedup_key` 且**内容相同**，命中去重，响应体是已存在的公告
        （`Idempotency-Replayed` 不置位），不重复广播；
      - `409 dedup_conflict`：同一个 `dedup_key` 但**内容不同**，服务端不会覆盖既有公告，
        提示调用方换一个 `dedup_key`（例如追加时间戳）或先撤回原公告；
      - 携带 `Idempotency-Key` 的网络重放返回首次的响应，与去重是两套独立机制。

      **副作用**：`publish=true` 且 `broadcast=true` 时，广播被排成异步任务，
      发布响应中的 `delivery_summary` 立即反映待投递数量，实际投递结果异步更新；
      逐条状态见 `GET /announcements/{announcement_id}/deliveries`。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/news.yaml#/components/schemas/CreateAnnouncementRequest
          example:
            title: 2024 暑期集训安排
            body_markdown: '## 时间：7 月 8 日起每周一、三、五 14:00 在 A301 训练。'
            category: training
            tags:
              - 训练
            priority: normal
            visibility: members
            publish: true
            publish_at: '2024-05-07T00:00:00.000Z'
            broadcast: true
            channel_ids:
              - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
            dedup_key: qq-group-884210
            source:
              kind: group_chat
              platform: qq
              group_name: DMU-ICPC-2024
              message_id: '884210'
              confidence: 0.82
    responses:
      '201':
        description: 公告已创建；`Location` 指向新资源，`ETag` 为其 `revision`。
        headers:
          Location:
            $ref: ../components/headers/common.yaml#/components/headers/Location
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
          Idempotency-Replayed:
            $ref: ../components/headers/common.yaml#/components/headers/IdempotencyReplayed
        content:
          application/json:
            schema:
              $ref: ../components/schemas/news.yaml#/components/schemas/Announcement
            example:
              id: ann_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              title: 2024 暑期集训安排
              body_markdown: '## 时间：7 月 8 日起每周一、三、五 14:00 在 A301 训练。'
              category: training
              tags:
                - 训练
              priority: normal
              pinned: false
              status: scheduled
              visibility: members
              publish_at: '2024-05-07T00:00:00.000Z'
              published_at: null
              expires_at: null
              archived_at: null
              source:
                kind: group_chat
                platform: qq
                group_name: DMU-ICPC-2024
                message_id: '884210'
                raw_text: null
                collected_at: null
                confidence: 0.82
              dedup_key: qq-group-884210
              broadcast_on_publish: true
              broadcast_channel_ids:
                - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              author: null
              created_by:
                id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                username: qq-bot
                display_name: QQ 机器人
                kind: service
              delivery_summary:
                pending: 1
                sent: 0
                failed: 0
              created_at: '2024-05-06T07:08:09.123Z'
              updated_at: '2024-05-06T07:08:09.123Z'
              revision: '1'
      '200':
        description: |
          命中去重键：7 天内已存在相同 `dedup_key` 的公告，本次**未创建**新资源，
          返回既有公告（其内容不会被本次请求覆盖）。
        headers:
          Location:
            $ref: ../components/headers/common.yaml#/components/headers/Location
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
          Idempotency-Replayed:
