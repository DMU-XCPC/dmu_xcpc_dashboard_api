    x-consistency: eventual
    x-freshness-bound: PT1M

announcementDeliveries:
  get:
    tags:
      - announcements
    operationId: listAnnouncementDeliveries
    summary: 列出公告的投递记录
    description: |
      列出该公告在各渠道上的投递记录（"公告 × 渠道"一条）。

      **权限**：`announcement:read`。

      **至少一次语义**：投递是 at-least-once——失败后按指数退避重试
      （`attempts` 递增、`next_attempt_at` 给出下次时间，之后回到 `sending`），
      因此**渠道侧可能收到重复消息**；公告默认模板中带有公告 id
      （`{{id}}`），接收方可据此去重。`skipped` 表示渠道被禁用或
      `visibility_filter` 不匹配，未尝试投递。

      **过滤**：`state`、`channel_id`。渠道被删除后，记录中的 `channel`
      是发起投递时的快照，仍可读。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: announcement_id
        in: path
        required: true
        description: 公告 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: ann_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - name: state
        in: query
        required: false
        description: 按投递状态过滤。
        schema:
          $ref: ../components/schemas/news.yaml#/components/schemas/DeliveryState
        example: failed
      - name: channel_id
        in: query
        required: false
        description: 只看某个渠道的投递记录。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/Page
      - $ref: ../components/parameters/common.yaml#/components/parameters/Size
      - $ref: ../components/parameters/common.yaml#/components/parameters/Order
    responses:
      '200':
        description: 投递记录分页结果。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/news.yaml#/components/schemas/PagedDelivery
            example:
              page: 1
              size: 20
              total: 1
              has_next: false
              items:
                - id: dlv_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  announcement_id: ann_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  channel:
                    id: chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                    name: 2024 级训练群
                    kind: qq_group
                  state: failed
                  attempts: 2
                  last_attempt_at: '2024-05-06T07:09:00.000Z'
                  sent_at: null
                  error: 'HTTP 500 from upstream'
                  external_message_id: null
                  next_attempt_at: '2024-05-06T07:11:00.000Z'
                  created_at: '2024-05-06T07:08:09.123Z'
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT1M
