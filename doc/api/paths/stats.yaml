statsSummary:
  get:
    tags:
      - stats
    operationId: getStatsSummary
    summary: 面板总览统计
    description: |
      **权限**：公开读。匿名可读仅当 `capabilities.public_read=true`；否则需要认证并持有
      `stats:read`（或 `stats:*`、`*`）。

      **语义**：返回面板首页使用的四组汇总：`members`（成员规模与活跃度分档）、
      `oj`（绑定账号与采集覆盖）、`ratings`（分平台 rating 分布）、`teams`（队伍数量）。
      `season` 可限定学年，例如 `2024-2025`，省略表示全部历史；`team_id` 可把成员相关
      统计收窄到单个队伍；`timezone` 用于活跃度按日归并，默认 `Asia/Shanghai`。

      **时序**：本端点读取**物化聚合**，返回值可能落后于采集写入：`generated_at` 是物化
      完成时刻，`stale=true` 表示已超过 `PT1H` 新鲜度上界，应等待下一次周期性物化
      重建后再读；客户端应展示 `stale` 而不是把旧值当作实时值。
    security:
      - {}
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: timezone
        in: query
        required: false
        description: 活跃度按日归并使用的 IANA 时区，默认 `Asia/Shanghai`。
        schema:
          type: string
          default: Asia/Shanghai
        example: Asia/Shanghai
      - name: season
        in: query
        required: false
        description: 学年标识，如 `2024-2025`；省略表示全部历史。格式非法返回 `422`。
        schema:
          type:
            - string
            - 'null'
          pattern: '^[0-9]{4}-[0-9]{4}$'
        example: 2024-2025
      - name: team_id
        in: query
        required: false
        description: 只统计该队伍的成员相关指标；省略表示全部成员。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: team_01J8Z5V6Q0K3M7N9P2R4T6W8X0
    responses:
      '200':
        description: 总览统计，含物化时刻与新鲜度。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/boards.yaml#/components/schemas/StatsSummaryResponse
            example:
              generated_at: '2024-05-06T07:00:00.000Z'
              stale: false
              members:
                by_club:
                  - club: acm_icpc
                    total: 74
                    active_30d: 41
                    dormant_90d: 12
                    inactive_365d: 6
                  - club: safewind_software
                    total: 88
                    active_30d: 29
                    dormant_90d: 15
                    inactive_365d: 11
                total: 138
                active_30d: 64
                dormant_90d: 21
                inactive_365d: 9
              oj:
                linked_handles: 226
                solved_total: 58214
                submissions_30d: 3120
                active_handles_30d: 118
              ratings:
                judges:
                  - judge: codeforces
                    max: 2410
                    avg: 1432.7
                    count: 96
                  - judge: atcoder
                    max: 2102
                    avg: 1188.4
                    count: 74
              teams:
                total: 18
                active: 11
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT1H
    x-cacheable: true
