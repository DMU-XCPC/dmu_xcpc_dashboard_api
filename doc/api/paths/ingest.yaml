ingestProblems:
  post:
    tags:
      - ingest
    operationId: ingestOjProblems
    summary: 批量上报 OJ 题目元数据
    description: |
      采集器上报题目元数据的写入口。提交记录里若引用了尚未入库的题目，
      服务端会先建立占位题目，之后可用本端点补全标题、标签与难度。

      **权限**：需要 `ingest:write`。缺少凭证 `401 unauthenticated`，
      已认证但 scope 不足 `403 insufficient_scope`。

      **幂等由自然键保证**：每题以 `(judge, external_id)` 为自然键。
      重复上报——无论是否更换 `Idempotency-Key`——都记为 `duplicate`，**不是错误**；
      已存在的题目只用非空字段补全缺失信息，不会清空已有值。相同 `Idempotency-Key` +
      相同请求体重放时返回**首次**的 `200 IngestResult` 并带
      `Idempotency-Replayed: true`；同键不同体返回 `409 idempotency_key_reused`。

      **部分成功**：`200` 响应体里的 `items[].status` 逐条给出
      `accepted` / `duplicate` / `rejected`。单条校验失败（`judge` 未启用、
      `title` 缺失或超长等）只把该条记为 `rejected`，其余照常写入。

      **整批拒绝**：条目数超过 `capabilities.ingest_batch_max`，默认 500返回
      `413 payload_too_large`，**整批不入库、无副作用**；请求体非法返回 `400`；
      语义错误无法定位到单条时返回 `422 validation_failed`；限流 `429`；
      服务端不可用 `503`。

      **乱序接受**：题目可在其提交记录之后才上报，服务端按自然键 upsert，不要求顺序。

      **时序**：题目写入后 `GET /oj/problems` 的**最终一致**视图才会包含它，
      `IngestResult.materialized_at` 给出可见时刻，新鲜度上界见 `x-freshness-bound`。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/oj_data.yaml#/components/schemas/IngestProblemsRequest
          example:
            crawler_run_id: run_01J8Z5V6Q0K3M7N9P2R4T6W8X0
            items:
              - judge: codeforces
                external_id: 1873A
                title: Short Sort
                tags:
                  - implementation
                difficulty: 800
                rating: 800
                url: https://codeforces.com/contest/1873/problem/A
    responses:
      '200':
        description: |
          批次已处理。`items` 与请求条目一一对应，可能是部分成功；
          重复条目计入 `duplicates` 而不是错误。
        headers:
          Idempotency-Replayed:
            $ref: ../components/headers/common.yaml#/components/headers/IdempotencyReplayed
          X-Request-Id:
            $ref: ../components/headers/common.yaml#/components/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/oj_data.yaml#/components/schemas/IngestResult
            example:
              accepted: 1
              duplicates: 0
              rejected: 0
              crawler_run_id: run_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              materialized_at: '2024-05-06T07:15:00.000Z'
              items:
                - index: 0
                  status: accepted
                  id: pbl_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  code: null
                  message: null
                  pointer: null
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '413':
        $ref: ../components/responses/common.yaml#/components/responses/PayloadTooLarge
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
      '503':
        $ref: ../components/responses/common.yaml#/components/responses/ServiceUnavailable
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT5M
