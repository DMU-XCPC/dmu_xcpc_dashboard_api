credentials:
  get:
    tags:
      - credentials
    operationId: listCredentials
    summary: 查询凭证列表
    description: |
      返回凭证**元信息**列表（永不包含明文密钥，只有 `prefix` 可作人工比对）。

      **可见范围**：默认只返回**调用者自己**的凭证，需要 `account:self`；
      带 `principal_id` 查询参数时改为返回指定主体的凭证，需要 `account:read`，
      缺少该 scope 返回 `403 insufficient_scope`。两种情况下都只返回该主体可见的
      凭证集合，`total` 随调用者而变。

      **过滤语义**：`kind` 按凭证类型过滤；`revoked` 省略时同时返回已撤销与未撤销的
      凭证，`true` 只返回已撤销、`false` 只返回未撤销（`revoked_at: null`）；
      `include_expired` 默认 `false`，此时`expires_at` 已过期但未撤销的凭证被排除，
      置 `true` 可将其一并列出。判断凭证是否还能使用需同时满足
      「`revoked_at` 为 `null`」且「`expires_at` 为 `null` 或不早于当前时刻」。

      **排序与分页**：按 `created_at` 倒序（新签发的在前），同一时刻以 `id` 稳定排序，
      翻页不重复、不跳过；`page` 越界返回空 `items`，不返回 `404`。

      **时序**：强一致——已提交的签发与撤销立即反映在结果中。撤销的传播对**鉴权生效**
      另有 ≤ 60 秒延迟，见 `DELETE /credentials/{credential_id}`。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: principal_id
        in: query
        required: false
        description: |
          指定要查询的主体 id，前缀 `acc_`。省略时只查询调用者自己，需要
          `account:self`；给出时需要 `account:read`，否则 `403 insufficient_scope`。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - name: kind
        in: query
        required: false
        description: 只返回指定类型的凭证。
        schema:
          $ref: ../components/schemas/identity.yaml#/components/schemas/CredentialKind
        example: api_key
      - name: revoked
        in: query
        required: false
        description: |
          撤销状态过滤：`true` 只返回已撤销（`revoked_at` 非空）；`false` 只返回未撤销；
          省略时两者都返回。
        schema:
          type: boolean
        example: false
      - name: include_expired
        in: query
        required: false
        description: |
          是否包含已过期（`expires_at` 早于当前时刻）的凭证，默认 `false`。
          该过滤只影响过期，不影响撤销状态。
        schema:
          type: boolean
          default: false
        example: false
      - $ref: ../components/parameters/common.yaml#/components/parameters/Page
      - $ref: ../components/parameters/common.yaml#/components/parameters/Size
    responses:
      '200':
        description: 凭证列表（分页）。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/accounts.yaml#/components/schemas/PagedCredential
            example:
              page: 1
              size: 20
              total: 2
              has_next: false
              items:
                - id: cred_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  principal_id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  kind: api_key
                  name: qq-bot
                  prefix: xcp_7f3a
                  scopes:
                    - announcement:write
                  created_at: '2024-01-02T03:04:05.000Z'
                  created_by:
                    id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                    username: alice
                    display_name: 张三
                    kind: human
                  expires_at: null
                  last_used_at: '2024-05-06T07:00:00.000Z'
                  revoked_at: null
                - id: cred_01J8Z5V6Q0K3M7N9P2R4T6W8X1
                  principal_id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  kind: session
                  name: Chrome on macOS
                  prefix: xcp_9c21
                  scopes:
                    - account:self
                  created_at: '2024-05-06T06:00:00.000Z'
                  created_by: null
                  expires_at: '2024-06-05T06:00:00.000Z'
                  last_used_at: '2024-05-06T07:08:09.123Z'
                  revoked_at: null
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong

credential:
  get:
    tags:
      - credentials
    operationId: getCredential
    summary: 获取单个凭证的元信息
    description: |
      返回单个凭证的元信息，不含明文密钥。

      **可见范围**：凭证归属主体本人，需要 `account:self`或持有 `account:manage`
      的主体可读。**不可见与不存在一律返回 `404 not_found`**，不返回 `403`，
      以避免通过响应差异枚举凭证 id。

      **缓存与并发**：凭证元信息不可变，因此**不返回 `ETag`、也没有条件请求**；
      本地可以按新鲜期缓存整份响应（`x-cacheable`）。
      **字段级新鲜度**：`last_used_at` 有 ≤ 5 分钟的
      写入延迟，是近似值，可能落后于真实最近使用时刻；`revoked_at` 与 `expires_at` 在
      响应中为准确值。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: credential_id
        in: path
        required: true
        description: 目标凭证的 id，前缀 `cred_`。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
    responses:
      '200':
        description: 凭证元信息。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/identity.yaml#/components/schemas/Credential
            example:
              id: cred_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              principal_id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              kind: api_key
              name: qq-bot
              prefix: xcp_7f3a
              scopes:
                - announcement:write
              created_at: '2024-01-02T03:04:05.000Z'
              created_by:
                id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                username: alice
                display_name: 张三
                kind: human
              expires_at: null
              last_used_at: '2024-05-06T07:00:00.000Z'
              revoked_at: null
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong
    x-cacheable: true

  delete:
    tags:
      - credentials
    operationId: revokeCredential
    summary: 撤销凭证
    description: |
      撤销一个凭证（`session` 或 `api_key`）。

      **权限与可见范围**：凭证归属主体本人，需要 `account:self`或持有
      `account:manage` 的主体可撤销。**不可见与不存在一律返回 `404 not_found`**。

      **副作用与时序**：撤销后该凭证**立即失效**，但鉴权链路上的传播存在
      **≤ 60 秒**的延迟（缓存与令牌校验窗口），因此撤销后最多 60 秒内仍可能有在途请求
      被放行；客户端应在本调用成功后立即清理本地令牌，不要依赖服务端反推。
      **允许撤销当前正在使用的凭证**：本请求本身会成功（`204`），此后该凭证在传播窗口
      结束后一律返回 `401 invalid_token`。

      **权限影响**：撤销不影响主体自身（`GET /accounts/{account_id}` 不变），
      也不影响其它凭证；若主体被停用，其全部凭证已在停用时被撤销。

      **幂等性**：总是返回 `204`——重复撤销、撤销已撤销或已过期的凭证同样返回 `204`，
      不区分「本次真的撤销了」与「本来就已经失效」。必须携带 `Idempotency-Key`，
      同键重放返回首次结果并带 `Idempotency-Replayed: true`。

      **不可撤销**：本操作**不可回滚**；需要恢复访问只能重新签发凭证
      （`POST /accounts/{account_id}/credentials`）。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: credential_id
        in: path
        required: true
        description: 目标凭证的 id，前缀 `cred_`。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    responses:
      '204':
        $ref: ../components/responses/common.yaml#/components/responses/NoContent
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong
