scoreboardEntryHistory:
  parameters:
    - name: scoreboard_id
      in: path
      required: true
      description: 榜单 id，前缀 `sbd_`。
      schema:
        $ref: ../components/schemas/common.yaml#/components/schemas/Id
      example: sbd_01J8Z5V6Q0K3M7N9P2R4T6W8X0
    - name: entry_id
      in: path
      required: true
      description: 条目 id（榜单内稳定，随物化刷新而保留）。
      schema:
        $ref: ../components/schemas/common.yaml#/components/schemas/Id
      example: sbe_01J8Z5V6Q0K3M7N9P2R4T6W8X1
  get:
    tags:
      - scoreboards
    operationId: getScoreboardEntryHistory
    summary: 获取单个榜单条目的历史序列
    description: |
      **权限**：公开读。匿名可读仅当 `capabilities.public_read=true` 且榜单
      `visibility=public`；否则需要认证并持有 `scoreboard:read`。榜单或条目不存在/不可见时
      返回 `404 not_found`。

      **语义**：返回该条目在窗口内的历史物化快照。`bucket` 对快照做降采样：同一桶内取
      最接近桶末的一个快照；`limit` 限制返回点数（从窗口末端向前取，默认 90，最大 365），
      超出时截断并只返回最近的点。

      **时序**：历史点来自历史物化批次，属于**物化聚合**数据，可能落后于采集写入；
      `timestamps` 与保留期外更早的快照不会返回，也不会因此报错（只是点更少）。
      落后超过 `PT15M` 上界时榜单本身应触发
      `POST /scoreboards/{scoreboard_id}/rebuild`，本次响应不受影响。
    security:
      - {}
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: from
        in: query
        required: false
        description: 窗口起点，含；省略时按 `limit` 向前回溯。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Timestamp
        example: '2024-02-06T00:00:00.000Z'
      - name: to
        in: query
        required: false
        description: 窗口终点，不含；省略时取当前时刻。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Timestamp
        example: '2024-05-06T07:00:00.000Z'
      - name: bucket
        in: query
        required: false
        description: 降采样粒度，默认 `day`；同一桶内只保留最接近桶末的快照。
        schema:
          $ref: ../components/schemas/boards.yaml#/components/schemas/TrendBucket
        example: day
      - name: limit
        in: query
        required: false
        description: 返回的最大点数，默认 90，最大 365；超出上限时取上限而不报错。
        schema:
          type: integer
          minimum: 1
          maximum: 365
          default: 90
        example: 90
    responses:
      '200':
        description: 条目历史序列，含服务端解析后的窗口。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/boards.yaml#/components/schemas/ScoreboardEntryHistory
            example:
              entry_id: sbe_01J8Z5V6Q0K3M7N9P2R4T6W8X1
              scoreboard_id: sbd_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              points:
                - at: '2024-03-01T00:00:00.000Z'
                  rank: 5
                  score: 744
                  solved_count: 744
                  rating: 1801
                - at: '2024-05-06T07:00:00.000Z'
                  rank: 3
                  score: 812
                  solved_count: 812
                  rating: 1873
              window:
                from: '2024-02-06T00:00:00.000Z'
                to: '2024-05-06T07:00:00.000Z'
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT15M
    x-cacheable: true

scoreboardRebuild:
  parameters:
    - name: scoreboard_id
      in: path
      required: true
      description: 榜单 id，前缀 `sbd_`。
      schema:
        $ref: ../components/schemas/common.yaml#/components/schemas/Id
      example: sbd_01J8Z5V6Q0K3M7N9P2R4T6W8X0
  post:
    tags:
      - scoreboards
    operationId: rebuildScoreboard
    summary: 触发榜单重建，异步执行
    description: |
      **权限**：需要 `scoreboard:manage`（或 `scoreboard:*`、`*`）。

      **语义**：为榜单排队一次重算任务，返回 `202` 与 `Job` 资源；客户端按
      `Location` 轮询 `GET /jobs/{job_id}` 直到终态。默认增量重算（只处理自上次物化以来
      有变化的主体），`full=true` 时忽略增量、直接全量重算。任务成功后 `result` 形如
      `{"scoreboard_id": ..., "entry_count": ...}`，榜单的 `generated_at` 随之更新、
      `stale` 归 `false`。

      **并发与幂等**：同一榜单同一时刻只允许一个重建任务；已有任务在跑时返回
      `409 conflict`（响应头不带 `Location`，客户端应改用 `GET /scoreboards/{id}`
      观察 `generated_at`/`stale`）。同一榜单重复触发不会产生并发重算；带相同
      `Idempotency-Key` 的重放返回首次的 `202` 与同一个 `job_id`，不重复排队。

      **时序**：任务入队是强一致的；重建完成前读取端仍可能返回旧条目数据
      （榜单读端点的 `x-freshness-bound` 为 `PT15M`）。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
      - name: full
        in: query
        required: false
        description: |
          为 `true` 时忽略增量、直接全量重算（耗时更长，用于修复历史数据或口径变更后
          的兜底）；默认 `false` 为增量重算。
        schema:
          type: boolean
          default: false
        example: false
    responses:
      '202':
        description: 重建任务已入队；按 `Retry-After` 轮询 `Location` 指向的任务。
        headers:
          Location:
            $ref: ../components/headers/common.yaml#/components/headers/Location
          Retry-After:
            $ref: ../components/headers/common.yaml#/components/headers/RetryAfter
        content:
          application/json:
            schema:
              $ref: ../components/schemas/common.yaml#/components/schemas/Job
            example:
              id: job_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              kind: scoreboard_rebuild
              state: queued
              progress:
                percent: 0
                message: 已入队，等待调度
              result: null
              error: null
              created_at: '2024-05-06T07:08:09.123Z'
              started_at: null
              finished_at: null
              created_by:
                id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                username: alice
                display_name: 张三
                kind: human
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/components/responses/Conflict
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong
