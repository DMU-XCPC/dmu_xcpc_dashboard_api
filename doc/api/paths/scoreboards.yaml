scoreboards:
  get:
    tags:
      - scoreboards
    operationId: listScoreboards
    summary: 列出榜单定义
    description: |
      **权限与可见性**：分三档。
      匿名请求只在服务器 `capabilities.public_read=true` 时被接受，且只能看到
      `visibility=public` 的榜单；已认证主体的可见范围取决于 scope：持有
      `scoreboard:read` 及以上的主体可以额外看到 `visibility=members` 与 `visibility=private`
      的榜单；只有 `scoreboard:read` 时看不到 `private`。
      匿名且 `public_read=false` 返回 `401`；已认证但缺 `scoreboard:read` 时，
      可见范围收窄到 `public`，不会再返回 `403`；不可见的榜单不出现在结果里，
      按 id 直接读取时返回 `404`。

      **过滤**：`scope` 按口径、`judge` 按平台、`q` 按名称/描述模糊匹配、`visibility`
      按可见性、`stale=true` 只返回新鲜度已落后的榜单，便于巡检并批量触发重建、
      `updated_since` 按 `updated_at` 严格递增做增量拉取。

      **时序**：榜单是**物化聚合**，返回值可能落后于采集写入。`generated_at` 是最近一次
      物化完成时刻，`stale` 表示该榜单已超出新鲜度上界 `PT15M`；落后超过该上界时应调用
      `POST /scoreboards/{scoreboard_id}/rebuild` 触发重建；重复触发不会并发重算。

      **分页与排序**：`page`/`size` 偏移分页，`size` 上限 200；`sort` 支持 `name`、
      `created_at`、`generated_at`，`order` 默认 `desc`。空结果返回 `items: []` 而非 `404`。
    security:
      - {}
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/Page
      - $ref: ../components/parameters/common.yaml#/components/parameters/Size
      - $ref: ../components/parameters/common.yaml#/components/parameters/Order
      - $ref: ../components/parameters/common.yaml#/components/parameters/UpdatedSince
      - name: scope
        in: query
        required: false
        description: 仅返回该口径的榜单。
        schema:
          $ref: ../components/schemas/boards.yaml#/components/schemas/ScoreboardScope
        example: individual
      - name: judge
        in: query
        required: false
        description: 仅返回限定该平台的榜单；不含跨平台榜单。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Judge
        example: codeforces
      - name: q
        in: query
        required: false
        description: 按名称与描述做大小写不敏感的模糊匹配。
        schema:
          type: string
          maxLength: 64
        example: 2024-2025
      - name: visibility
        in: query
        required: false
        description: 仅返回该可见性的榜单；结果仍受调用者可见性约束。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Visibility
        example: public
      - name: stale
        in: query
        required: false
        description: |
          `true` 只返回 `stale=true`（已落后于采集写入）的榜单，用于巡检；
          `false` 只返回新鲜的榜单；省略表示不限制。
        schema:
          type: boolean
        example: true
      - name: sort
        in: query
        required: false
        description: 排序字段；默认 `created_at`，与 `order` 组合。
        schema:
          type: string
          enum:
            - name
            - created_at
            - generated_at
            - updated_at
          default: created_at
        example: created_at
    responses:
      '200':
        description: 榜单定义分页结果。
        content:
          application/json:
            schema:
              $ref: ../components/schemas/boards.yaml#/components/schemas/PagedScoreboard
            example:
              page: 1
              size: 20
              total: 4
              has_next: false
              items:
                - id: sbd_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  name: CF 2024-2025 个人榜
                  description: 跨平台个人积分榜，按累计解题数排名。
                  scope: individual
                  metric: solved_count
                  judge: codeforces
                  judge_label: null
                  period:
                    kind: season
                    season: 2024-2025
                    window: null
                    from: null
                    to: null
                  filter:
                    judges:
                      - codeforces
                    enrollment_years:
                      - 2022
                      - 2023
                    labels:
                      - member
                    team_ids: []
                    include_inactive: false
                  visibility: public
                  entry_count: 137
                  generated_at: '2024-05-06T07:00:00.000Z'
                  stale: false
                  next_refresh_at: '2024-05-06T07:15:00.000Z'
                  source_updated_at: '2024-05-06T06:58:00.000Z'
                  revision: '17'
                  created_at: '2024-01-02T03:04:05.000Z'
                  updated_at: '2024-05-06T07:00:00.000Z'
                  created_by:
                    id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                    username: alice
                    display_name: 张三
                    kind: human
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT15M
    x-cacheable: true

  post:
    tags:
      - scoreboards
    operationId: createScoreboard
    summary: 创建榜单
    description: |
      **权限**：需要 `scoreboard:manage`（或 `scoreboard:*`、`*`）。

      **语义**：只写入榜单**定义**，不等待重算。因此 `201` 响应中的 `entry_count` 恒为
      `0`、`stale` 恒为 `true`、`generated_at` 为 `null`：首次物化由服务端排队的
      `scoreboard_rebuild` 任务（客户端可用 `GET /jobs/{job_id}` 观察）或下一次调度完成，
      完成后 `entry_count`/`generated_at` 才反映真实数据。`scope`+`metric`+`filter`
      完全相同的重复定义、以及与既有榜单重名都返回 `409 conflict`。

      **幂等**：必须携带 `Idempotency-Key`；同一主体 + 同一端点 + 同一键在保留期内重放
      返回首次的 `201` 与同一 `id`，并带 `Idempotency-Replayed: true`；请求体不同则
      `409 idempotency_key_reused`。

      **时序**：定义本身强一致且立即可读；返回的聚合字段是物化快照，可能落后于采集写入
      （`x-freshness-bound: PT15M`）。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/boards.yaml#/components/schemas/CreateScoreboardRequest
          example:
            name: CF 2024-2025 个人榜
            description: 跨平台个人积分榜，按累计解题数排名。
            scope: individual
            metric: solved_count
            judge: codeforces
            period:
              kind: season
              season: 2024-2025
            filter:
              judges:
                - codeforces
              include_inactive: false
            visibility: public
    responses:
      '201':
        description: 榜单已创建；条目数据待首次物化。
        headers:
          Location:
            $ref: ../components/headers/common.yaml#/components/headers/Location
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/boards.yaml#/components/schemas/Scoreboard
            example:
              id: sbd_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              name: CF 2024-2025 个人榜
              description: 跨平台个人积分榜，按累计解题数排名。
              scope: individual
              metric: solved_count
              judge: codeforces
              judge_label: null
              period:
                kind: season
                season: 2024-2025
                window: null
                from: null
                to: null
              filter:
                judges:
                  - codeforces
                enrollment_years: []
                labels: []
                team_ids: []
                include_inactive: false
              visibility: public
              entry_count: 0
              generated_at: null
              stale: true
              next_refresh_at: '2024-05-06T07:10:00.000Z'
              source_updated_at: null
              revision: '1'
              created_at: '2024-05-06T07:08:09.123Z'
              updated_at: '2024-05-06T07:08:09.123Z'
              created_by:
                id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                username: alice
                display_name: 张三
                kind: human
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '409':
        $ref: ../components/responses/common.yaml#/components/responses/Conflict
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT15M

scoreboard:
  parameters:
    - name: scoreboard_id
      in: path
      required: true
      description: 榜单 id，前缀 `sbd_`。
      schema:
        $ref: ../components/schemas/common.yaml#/components/schemas/Id
      example: sbd_01J8Z5V6Q0K3M7N9P2R4T6W8X0
  get:
    tags:
      - scoreboards
    operationId: getScoreboard
    summary: 获取单个榜单
    description: |
      **权限**：公开读。匿名可读仅当 `capabilities.public_read=true` 且榜单
      `visibility=public`；否则需要认证并持有 `scoreboard:read`，或通配的 `scoreboard:*` 与 `*`。
      不可见与不存在都返回 `404 not_found`（避免信息泄露）。

      **条件请求**：返回强 `ETag`（与 `revision` 一致）；带 `If-None-Match` 且未变化时
      返回 `304`，可直接用于离线缓存。

      **时序**：榜单是**物化聚合**，返回值可能落后于采集写入；`generated_at` 是物化时刻、
      `stale` 表示已超出 `PT15M` 上界；落后超上界应触发
      `POST /scoreboards/{scoreboard_id}/rebuild`。
    security:
      - {}
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: 榜单定义与物化状态。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/boards.yaml#/components/schemas/Scoreboard
            example:
              id: sbd_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              name: CF 2024-2025 个人榜
              description: 跨平台个人积分榜，按累计解题数排名。
              scope: individual
              metric: solved_count
              judge: codeforces
              judge_label: null
              period:
                kind: season
                season: 2024-2025
                window: null
                from: null
                to: null
              filter:
                judges:
                  - codeforces
                enrollment_years:
                  - 2022
                labels:
                  - member
                team_ids: []
                include_inactive: false
              visibility: public
              entry_count: 137
              generated_at: '2024-05-06T07:00:00.000Z'
              stale: false
              next_refresh_at: '2024-05-06T07:15:00.000Z'
              source_updated_at: '2024-05-06T06:58:00.000Z'
              revision: '17'
              created_at: '2024-01-02T03:04:05.000Z'
              updated_at: '2024-05-06T07:00:00.000Z'
              created_by:
                id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                username: alice
                display_name: 张三
                kind: human
      '304':
        $ref: ../components/responses/common.yaml#/components/responses/NotModified
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT15M
    x-cacheable: true
  patch:
    tags:
      - scoreboards
    operationId: updateScoreboard
    summary: 更新榜单定义
    description: |
      **权限**：需要 `scoreboard:manage`（或 `scoreboard:*`、`*`）。

      **语义**：合并式更新，只覆盖请求体中出现的字段。修改 `scope`、`metric`、`period`
      或 `filter` 会改变聚合口径：服务端立即把榜单置为 `stale: true` 并排队重算，
      因此 `200` 响应中的 `stale` 为 `true`、`generated_at` 仍是上一版物化时刻。
      仅改 `name`/`description`/`visibility`/`judge_label` 不会触发重算，`stale` 保持原值。
      重名、或改后与既有榜单的 `scope`+`metric`+`filter` 完全重复返回 `409 conflict`。

      **并发控制**：`If-Match` 携带上次读到的 `ETag`；不匹配返回
      `412 version_conflict`（`revision` 语义见 `ETag`）。成功响应返回新的 `ETag`。

      **幂等**：必须携带 `Idempotency-Key`；重放返回首次的 `200`，不再重复触发重算。

      **时序**：定义变更强一致并立即可见；聚合字段沿用上一版物化结果，
      `x-freshness-bound: PT15M`。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/IfMatch
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/boards.yaml#/components/schemas/UpdateScoreboardRequest
          example:
            metric: rating_sum
            filter:
              judges:
                - codeforces
                - atcoder
              include_inactive: true
            visibility: members
    responses:
      '200':
        description: 更新后的榜单定义；改变口径时 `stale=true`，等待重算。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/boards.yaml#/components/schemas/Scoreboard
            example:
              id: sbd_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              name: CF 2024-2025 个人榜
              description: 跨平台个人积分榜，按累计解题数排名。
              scope: individual
              metric: rating_sum
              judge: codeforces
              judge_label: null
              period:
                kind: season
                season: 2024-2025
                window: null
                from: null
                to: null
              filter:
                judges:
                  - codeforces
                  - atcoder
                enrollment_years: []
                labels: []
                team_ids: []
                include_inactive: true
              visibility: members
              entry_count: 137
              generated_at: '2024-05-06T07:00:00.000Z'
              stale: true
              next_refresh_at: '2024-05-06T07:10:00.000Z'
              source_updated_at: '2024-05-06T06:58:00.000Z'
              revision: '18'
              created_at: '2024-01-02T03:04:05.000Z'
              updated_at: '2024-05-06T07:09:00.000Z'
              created_by:
                id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                username: alice
                display_name: 张三
                kind: human
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/components/responses/Conflict
      '412':
        $ref: ../components/responses/common.yaml#/components/responses/PreconditionFailed
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT15M
  delete:
    tags:
      - scoreboards
    operationId: deleteScoreboard
    summary: 删除榜单
    description: |
      **权限**：需要 `scoreboard:manage`（或 `scoreboard:*`、`*`）。对不可见的榜单同样返回 `404`。

      **语义**：删除榜单定义，**同时清理其条目与历史快照**；操作不可撤销（契约不提供
      恢复端点）。删除后榜单不再出现在任何列表中，也不再被调度刷新。

      **幂等**：必须携带 `Idempotency-Key`。删除成功的记录保留 24 小时：同一 id 的重复
      `DELETE`，含同一幂等键重放都返回 `204`，不会因为"已删除"而报错；从未存在或对
      调用者不可见的 id 返回 `404`。

      **时序**：强一致；返回 `204` 后定义与条目均已不可读。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    responses:
      '204':
        $ref: ../components/responses/common.yaml#/components/responses/NoContent
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong

scoreboardEntries:
  parameters:
    - name: scoreboard_id
      in: path
      required: true
      description: 榜单 id，前缀 `sbd_`。
      schema:
        $ref: ../components/schemas/common.yaml#/components/schemas/Id
      example: sbd_01J8Z5V6Q0K3M7N9P2R4T6W8X0
  get:
    tags:
      - scoreboards
    operationId: listScoreboardEntries
    summary: 列出榜单排名条目
    description: |
      **权限**：公开读。匿名可读仅当 `capabilities.public_read=true` 且榜单
      `visibility=public`；否则需要认证并持有 `scoreboard:read`。榜单不可见或不存在返回 `404`。

      **过滤**：`q` 按展示名/OJ handle 模糊匹配，`team_id`、`judge`、`enrollment_year`
      收窄集合，`min_rank`/`max_rank` 按名次区间截取（闭区间，含端点）。

      **排序**：`sort` 支持 `rank`，默认、`score`、`solved_count`、`rating`、
      `activity_days`；`order` 默认 `asc`。**`sort=rank` 时忽略 `order`**，恒按名次升序
      （并列名次的相对顺序按 `id` 稳定）。榜单条目数可能很大，务必配合 `page`/`size`
      翻页（`size` 上限 200）。

      **时序**：条目是**物化聚合**，返回值可能落后于采集写入。响应顶层的 `generated_at`
      是本页数据的物化时刻、`stale` 表示已超出新鲜度上界 `PT15M`；落后超上界应触发
      `POST /scoreboards/{scoreboard_id}/rebuild`。`rank_delta` 给出相对上一次物化的
      名次变化。
    security:
      - {}
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/Page
      - $ref: ../components/parameters/common.yaml#/components/parameters/Size
      - $ref: ../components/parameters/common.yaml#/components/parameters/Order
      - name: q
        in: query
        required: false
        description: 按条目展示名或主体绑定的 OJ handle 做模糊匹配。
        schema:
          type: string
          maxLength: 64
        example: zhang
      - name: team_id
        in: query
        required: false
        description: 仅返回属于该队伍的条目（`scope=individual` 时按成员所属队伍过滤）。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: team_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - name: judge
        in: query
        required: false
        description: 仅返回在该平台有数据的条目。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Judge
        example: codeforces
      - name: enrollment_year
        in: query
        required: false
