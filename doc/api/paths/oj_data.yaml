ojProblems:
  get:
    tags:
      - oj-data
    operationId: listOjProblems
    summary: 查询 OJ 题目库
    description: |
      公开查询采集到的题目库，支持按标题模糊搜索、标签与难度/rating 区间筛选。
      返回的是**采集结果的最终一致视图**，`x-consistency: eventual`，
      最大滞后见 `x-freshness-bound`）。

      **可见性**：`security` 允许匿名、`bearerAuth` 与 `apiKeyAuth`。匿名调用仅在
      `GET /meta` 的 `capabilities.public_read = true` 时被接受；否则必须携带持有
      `oj:read` 的凭证；未带凭证返回 `401`，scope 不足返回 `403`。

      **数据范围**：只有公开 OJ 数据，即平台题目编号、标题、标签与难度，
      **不含手机号、学号等 PII**。

      **分页与缓存**：使用偏移分页 `page` / `size`，响应为 `PagedOjProblem`
      ，`page` 越界返回空 `items` 而不是 `404`。题目元数据变化频率低，
      本端点是 `x-cacheable: true` 的，客户端可安全缓存。
      `updated_since` 只返回 `updated_at` **严格晚于**该时刻的题目，
      与 `sort=updated_at` 组合做增量同步。

      **过滤**：`judge`、`q` 对标题做大小写不敏感的模糊匹配、`tag`，可重复，取并集、
      `min_difficulty` / `max_difficulty`、`min_rating` / `max_rating`，均为闭区间。
      `sort` 为 `external_id` / `title` / `difficulty` / `rating` / `first_seen_at` /
      `updated_at`，方向由 `order` 决定。参数无法解析或枚举未知返回 `400 bad_request`。
    security:
      - {}
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/Page
      - $ref: ../components/parameters/common.yaml#/components/parameters/Size
      - $ref: ../components/parameters/common.yaml#/components/parameters/Order
      - $ref: ../components/parameters/common.yaml#/components/parameters/UpdatedSince
      - name: judge
        in: query
        required: false
        description: 只返回该平台的题目。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Judge
        example: codeforces
      - name: q
        in: query
        required: false
        description: 标题模糊搜索关键字（大小写不敏感的子串匹配）。
        schema:
          type: string
          minLength: 1
          maxLength: 120
        example: Short Sort
      - name: tag
        in: query
        required: false
        description: 按标签过滤；可重复出现，多个标签之间是**并集**。
        style: form
        explode: true
        schema:
          type: array
          items:
            type: string
        example:
          - implementation
          - dp
      - name: min_difficulty
        in: query
        required: false
        description: 难度分值下界（闭区间）。
        schema:
          type: integer
        example: 800
      - name: max_difficulty
        in: query
        required: false
        description: 难度分值上界（闭区间）。
        schema:
          type: integer
        example: 1600
      - name: min_rating
        in: query
        required: false
        description: 难度 rating 下界（闭区间）。
        schema:
          type: integer
        example: 800
      - name: max_rating
        in: query
        required: false
        description: 难度 rating 上界（闭区间）。
        schema:
          type: integer
        example: 1600
      - name: sort
        in: query
        required: false
        description: 排序键；配合 `order` 使用，默认 `external_id` 升序。
        schema:
          type: string
          enum:
            - external_id
            - title
            - difficulty
            - rating
            - first_seen_at
            - updated_at
          default: external_id
        example: difficulty
    responses:
      '200':
        description: 题目库的一页。
        headers:
          X-Request-Id:
            $ref: ../components/headers/common.yaml#/components/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/oj_data.yaml#/components/schemas/PagedOjProblem
            example:
              page: 1
              size: 20
              total: 137
              has_next: true
              items:
                - id: pbl_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  judge: codeforces
                  external_id: 1873A
                  title: Short Sort
                  url: https://codeforces.com/contest/1873/problem/A
                  tags:
                    - implementation
                  difficulty: 800
                  rating: 800
                  solved_count: 12
                  attempt_count: 19
                  first_seen_at: '2024-04-01T02:00:00.000Z'
                  updated_at: '2024-05-06T07:00:00.000Z'
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT5M
    x-cacheable: true

ojHandleStats:
  get:
    tags:
      - oj-data
    operationId: getOjHandleStats
    summary: 获取单个 OJ 绑定的统计详情
    description: |
      公开查询某个 OJ 绑定的统计详情：聚合摘要（rating、解题数、近 30 天活跃度）
      加上指定时间窗内的最近提交样本与 rating 曲线点。数据是**采集结果的最终一致视图**
      （`x-consistency: eventual`，最大滞后见 `x-freshness-bound`）。

      **可见性**：`security` 允许匿名、`bearerAuth` 与 `apiKeyAuth`。匿名调用仅在
      `GET /meta` 的 `capabilities.public_read = true` 时被接受；否则必须携带持有
      `oj:read` 的凭证；未带凭证返回 `401`，scope 不足返回 `403`。

      **数据范围**：只有公开 OJ 数据；**不含手机号、学号等 PII**。
      注意 `OjHandle.verification_token` 之类的秘密字段不会出现在本响应中。

      **时间窗**：`window` 为 ISO-8601 duration，默认 `P90D`，最大 `P1095D` = 3 年；
      超过上限时按上限处理而不报错。`window` 越短返回的 `rating_points` 越密
      （服务端可能对长窗口做降采样），`recent_submissions` 始终最多 20 条。

      **错误分支**：`handle_id` 不是合法的 `Id` 或对应绑定不存在（已解绑、已删除）时返回
      `404 not_found`；`window` 无法解析返回 `400 bad_request`。
    security:
      - {}
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: handle_id
        in: path
        required: true
        description: OJ 绑定 id，前缀 `ojh_`。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: ojh_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - name: window
        in: query
        required: false
        description: |
          统计回看的时间窗（ISO-8601 duration），默认 `P90D`，最大 `P1095D`；
          超过上限按上限处理。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Duration
        example: P90D
    responses:
      '200':
        description: 该绑定的统计详情。
        headers:
          X-Request-Id:
            $ref: ../components/headers/common.yaml#/components/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/oj_data.yaml#/components/schemas/OjHandleStats
            example:
              handle_id: ojh_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              judge: codeforces
              handle: tourist
              window: P90D
              rating: 3721
              max_rating: 3800
              rating_delta_30d: 42
              solved_count: 1873
              attempted_count: 2104
              submissions_30d: 96
              active_days_30d: 21
              computed_at: '2024-05-06T07:00:05.000Z'
              recent_submissions:
                - id: sub_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  judge: codeforces
                  submission_id: '223456789'
                  handle: tourist
                  principal_id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  problem:
                    judge: codeforces
                    external_id: 1873A
                    title: Short Sort
                  verdict: accepted
                  verdict_raw: OK
                  language: GNU C++17
                  submitted_at: '2024-05-06T06:59:12.000Z'
                  ingested_at: '2024-05-06T07:01:00.000Z'
                  contest: null
                  is_first_ac: true
              rating_points:
                - at: '2024-05-01T00:00:00.000Z'
                  rating: 3679
                - at: '2024-05-06T00:00:00.000Z'
                  rating: 3721
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT15M
    x-cacheable: true
