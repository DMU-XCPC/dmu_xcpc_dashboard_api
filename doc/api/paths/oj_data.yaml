ojSubmissions:
  get:
    tags:
      - oj-data
    operationId: listOjSubmissions
    summary: 查询 OJ 提交记录
    description: |
      公开查询采集到的 OJ 提交记录。这是**采集结果的最终一致视图**
      ，`x-consistency: eventual`，最大滞后见 `x-freshness-bound`。刚通过
      `POST /ingest/oj/submissions` 写入的数据可能尚未出现在结果里。

      **可见性**：`security` 允许匿名、`bearerAuth` 与 `apiKeyAuth` 三种方式。
      匿名调用仅在 `GET /meta` 的 `capabilities.public_read = true` 时被接受；
      若服务器关闭了公开读取，则必须携带持有 `oj:read` 的凭证，
      否则返回错误：未带凭证为 `401 unauthenticated`，scope 不足为 `403 insufficient_scope`。

      **数据范围**：本端点只暴露**公开的 OJ 数据**，即外部平台本来就公开的提交、题目、
      rating 与账号名），**不含手机号、学号、邮箱等 PII**；`principal_id` 仅是内部主体标识，
      用于与成员关联，不携带任何个人档案字段。

      **排序与游标**：结果**固定按 `submitted_at` 倒序**，同一时刻按 `id` 倒序作为决胜键。
      游标与排序键绑定：`cursor` 只能来自本端点上一次响应，不能跨过滤条件复用；
      服务端保证在数据持续增长期间不跳过、不重复已返回的条目。

      **过滤**：`judge`、`handle`、`principal_id`、`problem_external_id`、`contest_id`、
      `verdict`，可重复，取并集、`from` / `to`，按 `submitted_at` 的半开区间 `[from, to)`。
      时间或枚举格式错误返回 `400 bad_request`；`cursor` 已过期返回 `410 cursor_expired`
      ，重新从第一页开始即可。
    security:
      - {}
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/Cursor
      - $ref: ../components/parameters/common.yaml#/components/parameters/Limit
      - name: judge
        in: query
        required: false
        description: 只返回该平台的提交。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Judge
        example: codeforces
      - name: handle
        in: query
        required: false
        description: 按 OJ 账号名精确过滤（大小写敏感，外部平台原始值）。
        schema:
          type: string
          minLength: 1
          maxLength: 64
        example: tourist
      - name: principal_id
        in: query
        required: false
        description: 只返回已绑定到该主体的提交；未绑定的提交不会命中任何 `principal_id`。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - name: problem_external_id
        in: query
        required: false
        description: 按外部平台的原始题目编号过滤（通常与 `judge` 一起使用）。
        schema:
          type: string
          minLength: 1
          maxLength: 128
        example: 1873A
      - name: contest_id
        in: query
        required: false
        description: 按外部平台的原始比赛编号过滤；练习提交（不在比赛中）不会被命中。
        schema:
          type: string
          minLength: 1
          maxLength: 128
        example: '1873'
      - name: verdict
        in: query
        required: false
        description: 按归一化评测结果过滤；可重复出现，多个取值之间是**并集**。
        style: form
        explode: true
        schema:
          type: array
          items:
            $ref: ../components/schemas/oj_data.yaml#/components/schemas/OjVerdict
        example:
          - accepted
          - wrong_answer
      - name: from
        in: query
        required: false
        description: 只返回 `submitted_at` **不早于**该时刻的提交，含边界。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Timestamp
        example: '2024-05-01T00:00:00.000Z'
      - name: to
        in: query
        required: false
        description: 只返回 `submitted_at` **早于**该时刻的提交，不含边界。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Timestamp
        example: '2024-06-01T00:00:00.000Z'
    responses:
      '200':
        description: 提交记录的一页，按 `submitted_at` 倒序。
        headers:
          X-Request-Id:
            $ref: ../components/headers/common.yaml#/components/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/oj_data.yaml#/components/schemas/OjSubmissionPage
            example:
              has_more: true
              next_cursor: eyJ0IjoiMjAyNC0wNS0wNlQwNjo1OToxMi4wMDBaIiwiaWQiOiJzdWJfMDFKOFo1VjZRMEszTTdOOVAyUjRUNlc4WDAifQ
              items:
                - id: sub_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  judge: codeforces
                  submission_id: '223456789'
                  handle: tourist
                  principal_id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  problem:
                    judge: codeforces
                    external_id: 1873A
                    title: Short Sort
                    url: https://codeforces.com/contest/1873/problem/A
                    tags:
                      - implementation
                    difficulty: 800
                    rating: 800
                  verdict: accepted
                  verdict_raw: OK
                  language: GNU C++17
                  submitted_at: '2024-05-06T06:59:12.000Z'
                  ingested_at: '2024-05-06T07:01:00.000Z'
                  contest: null
                  is_first_ac: true
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '410':
        $ref: ../components/responses/common.yaml#/components/responses/Conflict
        description: |
          游标失效（`410 cursor_expired`）：`cursor` 超出有效期或与当前过滤条件不匹配；
            重新从第一页开始即可。
          重新从第一页开始拉取即可。
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: eventual
    x-freshness-bound: PT5M
    x-cacheable: true

ojRatingHistory:
  get:
    tags:
      - oj-data
    operationId: listOjRatingHistory
    summary: 查询 OJ rating 变化历史
    description: |
      公开查询采集到的 rating，含段位/分数变化历史，用于绘制成长曲线。
      返回的是**采集结果的最终一致视图**，`x-consistency: eventual`，
      最大滞后见 `x-freshness-bound`）。

      **可见性**：`security` 允许匿名、`bearerAuth` 与 `apiKeyAuth`。匿名调用仅在
      `GET /meta` 的 `capabilities.public_read = true` 时被接受；否则必须携带持有
      `oj:read` 的凭证，缺少凭证返回 `401 unauthenticated`、scope 不足返回
      `403 insufficient_scope`。

      **数据范围**：只有公开 OJ 数据（账号名、比赛、rating 变化），
      **不含手机号、学号等 PII**。

      **排序与游标**：固定按 `at` 倒序（同一时刻按 `id` 倒序决胜），游标与排序键绑定，
      `cursor` 只能来自本端点上一次响应；数据增长期间保证不跳过、不重复。

      **过滤**：`judge`、`handle`、`principal_id`、`from` / `to`，按 `at` 的半开区间
      `[from, to)`。参数无法解析返回 `400 bad_request`；游标失效返回 `410 cursor_expired`。
    security:
      - {}
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/Cursor
      - $ref: ../components/parameters/common.yaml#/components/parameters/Limit
      - name: judge
        in: query
        required: false
        description: 只返回该平台的 rating 变化。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Judge
        example: codeforces
      - name: handle
        in: query
        required: false
        description: 按 OJ 账号名精确过滤（大小写敏感，外部平台原始值）。
        schema:
          type: string
          minLength: 1
          maxLength: 64
        example: tourist
      - name: principal_id
        in: query
        required: false
        description: 只返回已绑定到该主体的 rating 变化记录。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - name: from
        in: query
        required: false
        description: 只返回 `at` **不早于**该时刻的记录，含边界。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Timestamp
        example: '2024-01-01T00:00:00.000Z'
      - name: to
        in: query
        required: false
        description: 只返回 `at` **早于**该时刻的记录，不含边界。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Timestamp
        example: '2024-06-01T00:00:00.000Z'
    responses:
      '200':
        description: rating 变化记录的一页，按 `at` 倒序。
        headers:
          X-Request-Id:
            $ref: ../components/headers/common.yaml#/components/headers/RequestId
        content:
          application/json:
            schema:
              $ref: ../components/schemas/oj_data.yaml#/components/schemas/OjRatingHistoryPage
