quotaFinalize:
  post:
    tags:
      - quotas
    operationId: finalizeQuota
    summary: 定案名额池：closed 转为 finalized
    description: |
      需要 `quota:manage`。把 `closed` 的名额池定案，**不可撤销**。

      **前置条件**：池内**候补之外**的 `pending` 认领必须已经处理完，否则返回 `409 conflict`
      并在 `detail` 里列出 claim id 列表；**仍在候补**（`waitlist_position` 非空）的 `pending`
      不阻塞定案——它们会被置为 `expired`，名额不会静默地留在一个永远不会被批准的状态里。

      **副作用**：候补中的 `pending` 变为 `expired`；`finalized` 后所有审核端点
      （approve/reject/withdraw/release）与认领端点都以 `409 quota_finalized` 拒绝；`counts` 冻结。
      定案是**危险操作**，本系统不提供回退端点，如需重开请新建名额池。

      **幂等**：重复对 `finalized` 的池调用返回当前资源（`200`）。
      对 `draft` 池调用返回 `409 quota_not_open`。

      **时序**：强一致；定案后 `GET /quotas/{quota_id}/summary` 立即反映冻结结果。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: quota_id
        in: path
        required: true
        description: 名额池 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    responses:
      '200':
        description: 名额池已定案（或本就处于 `finalized`）。
