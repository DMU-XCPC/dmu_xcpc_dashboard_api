quotaClaimRelease:
  post:
    tags:
      - quotas
    operationId: releaseQuotaClaim
    summary: 释放已批准的认领，管理员可调用
    description: |
      **用途**：名额被错误占用、或队伍退赛时，管理员把**已批准**的认领释放掉，让名额回到池里。
      队伍自己不能释放已批准名额——那需要管理员复核，因此没有对应的自助端点。

      **权限**：需要 `quota:manage`。

      **状态**：只有 `approved` 可释放，结果状态为 `released`；对
      `pending`/`rejected`/`withdrawn`/`expired`/`released` 调用返回 `409 conflict`
      （未批准的请用 `POST .../withdraw`）。池已 `finalized` 或 `archived` 返回 `409 quota_finalized`。

      **副作用**：`counts.remaining` 立即增加，候补队列按优先级前移，**不会自动批准**任何候补；
      写审计记录，`reason` 一并入库。

      **并发**：支持 `If-Match` + `revision`，不匹配返回 `412 precondition_failed`。
      **幂等**：`Idempotency-Key` 必填，同键重放返回首次结果。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: quota_id
        in: path
        required: true
        description: 名额池 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - name: claim_id
        in: path
        required: true
        description: 认领 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: claim_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
      - $ref: ../components/parameters/common.yaml#/components/parameters/IfMatch
    requestBody:
      required: false
      content:
        application/json:
          schema:
            $ref: ../components/schemas/quotas.yaml#/components/schemas/ReleaseQuotaClaimRequest
          example:
            reason: 队伍退赛
    responses:
      '200':
        description: 处理后的认领（状态为 `released`）。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
