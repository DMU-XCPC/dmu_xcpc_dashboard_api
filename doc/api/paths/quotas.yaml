quotaClaimWithdraw:
  post:
    tags:
      - quotas
    operationId: withdrawQuotaClaim
    summary: 撤销认领，提交方或管理员可调用
    description: |
      撤销一个**尚未审核**的认领。调用者必须是：

      - 提交该认领的本人，或该认领所属队伍的队长（scope `quota:claim`）；或
      - 持有 `quota:manage` 的管理员。

      其它主体的请求返回 `403 forbidden`；认领不存在或不可见返回 `404 not_found`。

      **状态**：只有 `pending` 可撤销；对 `approved`/`rejected`/`withdrawn`/`expired`
      调用返回 `409 conflict`（已批准的名额不能由此端点释放）。
      已 `finalized` 的池返回 `409 quota_finalized`。

      **副作用**：撤销释放该认领的候补顺位，队列中后续认领的
      `waitlist_position` 立即前移（不会自动批准）。会写审计日志。

      **幂等**：`Idempotency-Key` 必填；同一键重放返回首次的撤销结果。
      无请求体，故不引用 Request schema。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: quota_id
        in: path
        required: true
        description: 名额池 id。
        schema:
