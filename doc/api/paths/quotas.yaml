    operationId: createQuotaClaim
    summary: 提交认领申请
    description: |
      需要 `quota:claim`（或 `quota:manage`）。可由队伍队长提交，也可由持有
      `quota:claim` 的机器人**代为提交**；服务端校验提交者属于该队伍或具备代提权限。

      **状态**：提交成功后认领状态**恒为 `pending`**，必须经管理员
      `POST .../approve` 批准才占用名额；`pending` 不减少 `remaining`。

      **错误分支**：

      - 同一队伍在本池的未终结认领数（`pending` + `approved`）已达
        `max_claims_per_team`，默认 2→ `409 team_claim_limit_reached`；
      - 池处于 `draft`，或当前早于 `claim_window.opens_at` → `409 quota_not_open`；
      - 当前晚于 `claim_window.closes_at` → `409 claim_window_closed`；
      - 池处于 `closed` → `409 quota_not_open`；`finalized`/`archived` → `409 quota_finalized`；
      - 成员不在任何社团（`clubs` 为空）或人数不在 1..8 → `422 validation_failed`；
      - 不满足 `eligibility` → `403 forbidden`。

      **超额**：认领数超过 `remaining` 时**允许提交**，响应中的
      `waitlist_position` 给出候补顺位，不返回错误。

      **幂等**：`Idempotency-Key` 必填；同一键重放返回**同一个**认领
      （不会重复占用每队额度），并带 `Idempotency-Replayed: true`。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: quota_id
        in: path
        required: true
        description: 名额池 id。
        schema:
