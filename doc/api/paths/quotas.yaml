quotas:
  get:
    tags:
      - quotas
    operationId: listQuotas
    summary: 列出名额池
    description: |
      按条件检索名额池，默认按 `created_at` 降序。任何持有 `quota:read` 的主体
      ，含机器人都可以查看；`draft` 状态的名额池对普通成员也可见，便于提前知晓安排。

      **过滤**：`status` 按状态机取值；`season` 与 `kind` 过滤比赛属性；
      `updated_since` 只返回 `updated_at` 严格晚于该时刻的名额池，
      与 `sort=created_at&order=asc` 组合可用于增量追赶（此时 `ETag` 不适用）。

      **一致性**：强一致。每个名额池的 `counts` 与其 `status` 来自同一事务视图。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/Page
      - $ref: ../components/parameters/common.yaml#/components/parameters/Size
      - $ref: ../components/parameters/common.yaml#/components/parameters/UpdatedSince
      - name: status
        in: query
        required: false
        description: 只返回指定状态的名额池；重复或未知取值返回 `400 bad_request`。
        schema:
          $ref: ../components/schemas/quotas.yaml#/components/schemas/QuotaStatus
        example: open
      - name: season
        in: query
        required: false
        description: 只返回指定赛季（`YYYY-YYYY`）的名额池。
        schema:
          type: string
          pattern: '^\d{4}-\d{4}$'
        example: 2024-2025
      - name: kind
        in: query
        required: false
        description: 只返回指定竞赛类型的名额池。
        schema:
          $ref: ../components/schemas/quotas.yaml#/components/schemas/ContestKind
        example: regional
      - name: sort
        in: query
        required: false
        description: |
          排序键。`held_on` 以比赛举办日期排序，未设置举办日期的名额池排在最后。
        schema:
          type: string
          enum:
            - created_at
            - held_on
            - quota_total
            - updated_at
          default: created_at
        example: created_at
      - $ref: ../components/parameters/common.yaml#/components/parameters/Order
    responses:
      '200':
        description: 名额池分页列表。
        headers:
          X-RateLimit-Limit:
            $ref: ../components/headers/common.yaml#/components/headers/RateLimitLimit
          X-RateLimit-Remaining:
            $ref: ../components/headers/common.yaml#/components/headers/RateLimitRemaining
          X-RateLimit-Reset:
            $ref: ../components/headers/common.yaml#/components/headers/RateLimitReset
        content:
          application/json:
            schema:
              $ref: ../components/schemas/quotas.yaml#/components/schemas/PagedQuota
            example:
              page: 1
              size: 20
              total: 1
              has_next: false
              items:
                - id: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                  title: 2024 南京站名额
                  contest:
                    name: 2024 ICPC 亚洲区域赛（南京）
                    kind: regional
                    season: 2024-2025
                    external_id: icpc-2024-nanjing
                    held_on: '2024-11-16'
                    location: 南京
                    url: https://icpc.example.edu/nanjing-2024
                  quota_total: 6
                  max_claims_per_team: 2
                  status: open
                  counts:
                    claims_pending: 2
                    claims_approved: 3
                    claims_rejected: 1
                    claims_withdrawn: 0
                    remaining: 3
                  claim_window:
                    opens_at: '2024-09-01T00:00:00.000Z'
                    closes_at: '2024-09-15T00:00:00.000Z'
                  eligibility: null
                  notes: null
                  created_by: null
                  opened_at: '2024-09-01T00:00:00.000Z'
                  closed_at: null
                  finalized_at: null
                  created_at: '2024-08-20T02:00:00.000Z'
                  updated_at: '2024-09-03T07:08:09.123Z'
                  revision: '7'
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong
  post:
    tags:
      - quotas
    operationId: createQuota
    summary: 新建名额池
    description: |
      需要 `quota:manage`。创建的名额池初始状态**恒为 `draft`**，
      `counts` 全零；这些字段不接受客户端指定。
      创建后需调用 `POST /quotas/{quota_id}/open` 才会接受认领。

      **唯一性**：同一 `contest.season` + `contest.name` + `contest.kind` 重复时
      返回 `409 conflict`；如需调整已有池请用 `PATCH`。

      **幂等**：`Idempotency-Key` 必填；同一主体 + 同一键重放返回**首次**创建的
      名额池与相同的 `Location`，并带 `Idempotency-Replayed: true`。

      **时序**：强一致，返回时名额池已可被 `GET /quotas/{quota_id}` 读到。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/quotas.yaml#/components/schemas/CreateQuotaRequest
          example:
            title: 2024 南京站名额
            contest:
              name: 2024 ICPC 亚洲区域赛（南京）
              kind: regional
              season: 2024-2025
              external_id: icpc-2024-nanjing
              held_on: '2024-11-16'
              location: 南京
              url: https://icpc.example.edu/nanjing-2024
            quota_total: 6
            max_claims_per_team: 2
            claim_window:
              opens_at: '2024-09-01T00:00:00.000Z'
              closes_at: '2024-09-15T00:00:00.000Z'
            eligibility: null
            notes: 每队最多 3 人，含 1 名替补。
    responses:
      '201':
        description: 创建成功，初始状态为 `draft`。
        headers:
          Location:
            $ref: ../components/headers/common.yaml#/components/headers/Location
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/quotas.yaml#/components/schemas/Quota
            example:
              id: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              title: 2024 南京站名额
              contest:
                name: 2024 ICPC 亚洲区域赛（南京）
                kind: regional
                season: 2024-2025
                external_id: icpc-2024-nanjing
                held_on: '2024-11-16'
                location: 南京
                url: https://icpc.example.edu/nanjing-2024
              quota_total: 6
              max_claims_per_team: 2
              status: draft
              counts:
                claims_pending: 0
                claims_approved: 0
                claims_rejected: 0
                claims_withdrawn: 0
                remaining: 6
              claim_window:
                opens_at: '2024-09-01T00:00:00.000Z'
                closes_at: '2024-09-15T00:00:00.000Z'
              eligibility: null
              notes: 每队最多 3 人，含 1 名替补。
              created_by:
                id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                username: alice
                display_name: 张三
                kind: human
              opened_at: null
              closed_at: null
              finalized_at: null
              created_at: '2024-08-20T02:00:00.000Z'
              updated_at: '2024-08-20T02:00:00.000Z'
              revision: '1'
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '409':
        $ref: ../components/responses/common.yaml#/components/responses/Conflict
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong

quota:
  get:
    tags:
      - quotas
    operationId: getQuota
    summary: 获取名额池
    description: |
      需要 `quota:read`。返回名额池及其计数快照。

      **缓存**：带强 `ETag`；`If-None-Match` 命中返回 `304`（无响应体），
      客户端应改为使用本地副本。不存在或不可见一律返回 `404 not_found`。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: quota_id
        in: path
        required: true
        description: 名额池 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IfNoneMatch
    responses:
      '200':
        description: 名额池当前状态。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/quotas.yaml#/components/schemas/Quota
            example:
              id: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              title: 2024 南京站名额
              contest:
                name: 2024 ICPC 亚洲区域赛（南京）
                kind: regional
                season: 2024-2025
                external_id: icpc-2024-nanjing
                held_on: '2024-11-16'
                location: 南京
                url: https://icpc.example.edu/nanjing-2024
              quota_total: 6
              max_claims_per_team: 2
              status: open
              counts:
                claims_pending: 2
                claims_approved: 3
                claims_rejected: 1
                claims_withdrawn: 0
                remaining: 3
              claim_window:
                opens_at: '2024-09-01T00:00:00.000Z'
                closes_at: '2024-09-15T00:00:00.000Z'
              eligibility: null
              notes: 每队最多 3 人，含 1 名替补。
              created_by:
                id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                username: alice
                display_name: 张三
                kind: human
              opened_at: '2024-09-01T00:00:00.000Z'
              closed_at: null
              finalized_at: null
              created_at: '2024-08-20T02:00:00.000Z'
              updated_at: '2024-09-03T07:08:09.123Z'
              revision: '7'
      '304':
        $ref: ../components/responses/common.yaml#/components/responses/NotModified
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong
    x-cacheable: true
  patch:
    tags:
      - quotas
    operationId: updateQuota
    summary: 修改名额池
    description: |
      需要 `quota:manage`。合并式部分更新，只覆盖出现的字段。

      **状态约束**：`status=finalized`（或 `archived`）后只能修改 `notes`，
      修改其它字段返回 `409 quota_finalized`。
      **配额约束**：把 `quota_total` 降到低于 `counts.claims_approved` 时
      返回 `409 quota_exceeded`，不做任何修改。
      **资格约束**：`eligibility.min_team_size > max_team_size` 等跨字段错误返回 `422`。

      **并发**：建议带 `If-Match`（取 `GET` 的 `ETag`）；不匹配返回 `412 version_conflict`。
      **幂等**：`Idempotency-Key` 必填，重放返回首次结果。
      **时序**：强一致，返回的 `revision` 已递增，变更立即对后续请求生效。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: quota_id
        in: path
        required: true
        description: 名额池 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
      - $ref: ../components/parameters/common.yaml#/components/parameters/IfMatch
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/quotas.yaml#/components/schemas/UpdateQuotaRequest
          example:
            quota_total: 8
            notes: 名额追加到 8 个。
    responses:
      '200':
        description: 更新后的名额池。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/quotas.yaml#/components/schemas/Quota
            example:
              id: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              title: 2024 南京站名额
              contest:
                name: 2024 ICPC 亚洲区域赛（南京）
                kind: regional
                season: 2024-2025
                external_id: icpc-2024-nanjing
                held_on: '2024-11-16'
                location: 南京
                url: https://icpc.example.edu/nanjing-2024
              quota_total: 8
              max_claims_per_team: 2
              status: open
              counts:
                claims_pending: 2
                claims_approved: 3
                claims_rejected: 1
                claims_withdrawn: 0
                remaining: 5
              claim_window:
                opens_at: '2024-09-01T00:00:00.000Z'
                closes_at: '2024-09-15T00:00:00.000Z'
              eligibility: null
              notes: 名额追加到 8 个。
              created_by: null
              opened_at: '2024-09-01T00:00:00.000Z'
              closed_at: null
              finalized_at: null
              created_at: '2024-08-20T02:00:00.000Z'
              updated_at: '2024-09-04T07:08:09.123Z'
              revision: '8'
      '400':
        $ref: ../components/responses/common.yaml#/components/responses/BadRequest
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/components/responses/Conflict
      '412':
        $ref: ../components/responses/common.yaml#/components/responses/PreconditionFailed
      '422':
        $ref: ../components/responses/common.yaml#/components/responses/UnprocessableEntity
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong
  delete:
    tags:
      - quotas
    operationId: deleteQuota
    summary: 删除名额池
    description: |
      需要 `quota:manage`。仅当池内**不存在任何 `approved` 认领**时可删除；
      否则返回 `409 conflict`，应先走归档（`archived`）保留历史。

      删除会级联删除该池的 `pending`/`rejected`/`withdrawn` 认领记录，
      并发布 `quotas` 的 `delete` 变更事件。**不可撤销**。

      **幂等**：`Idempotency-Key` 必填；对已删除的池重复调用同样返回 `204`。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: quota_id
        in: path
        required: true
        description: 名额池 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    responses:
      '204':
        $ref: ../components/responses/common.yaml#/components/responses/NoContent
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/components/responses/Conflict
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong

quotaOpen:
  post:
    tags:
      - quotas
    operationId: openQuota
    summary: 开启名额池：draft 转为 open
    description: |
      需要 `quota:manage`。把 `draft` 的名额池置为 `open`，开始接受认领。

      **窗口**：未设置 `claim_window` 时，服务端以默认值补齐
      `opens_at=now`、`closes_at=now+P14D`；已设置则原样保留。

      **幂等**：重复对 `open` 的池调用返回当前资源（`200`），不报错也不改变
      `opened_at`。对 `closed`/`finalized`/`archived` 的池调用返回 `409`
      （`quota_finalized` 或 `conflict`），**不支持重新开启**。

      **时序**：强一致；返回后窗口立即可用。会写审计日志。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: quota_id
        in: path
        required: true
        description: 名额池 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    responses:
      '200':
        description: 名额池已开启（或本就处于 `open`）。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/quotas.yaml#/components/schemas/Quota
            example:
              id: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              title: 2024 南京站名额
              contest:
                name: 2024 ICPC 亚洲区域赛（南京）
                kind: regional
                season: 2024-2025
              quota_total: 6
              max_claims_per_team: 2
              status: open
              counts:
                claims_pending: 0
                claims_approved: 0
                claims_rejected: 0
                claims_withdrawn: 0
                remaining: 6
              claim_window:
                opens_at: '2024-09-01T00:00:00.000Z'
                closes_at: '2024-09-15T00:00:00.000Z'
              eligibility: null
              notes: null
              created_by: null
              opened_at: '2024-09-01T00:00:00.000Z'
              closed_at: null
              finalized_at: null
              created_at: '2024-08-20T02:00:00.000Z'
              updated_at: '2024-09-01T00:00:00.000Z'
              revision: '2'
      '401':
        $ref: ../components/responses/common.yaml#/components/responses/Unauthenticated
      '403':
        $ref: ../components/responses/common.yaml#/components/responses/Forbidden
      '404':
        $ref: ../components/responses/common.yaml#/components/responses/NotFound
      '409':
        $ref: ../components/responses/common.yaml#/components/responses/Conflict
      '429':
        $ref: ../components/responses/common.yaml#/components/responses/RateLimited
      '500':
        $ref: ../components/responses/common.yaml#/components/responses/InternalError
    x-idempotent: true
    x-consistency: strong

quotaClose:
  post:
    tags:
      - quotas
    operationId: closeQuota
    summary: 关闭认领窗口：open 转为 closed
    description: |
      需要 `quota:manage`。把 `open` 的名额池置为 `closed`。

      **语义**：关闭后**不再接受新认领**（提交认领返回 `409 quota_not_open`），
      但已存在的 `pending` 认领**仍可审核**（批准/拒绝），直到 `finalize`。
      因此 `closed` 是"只收审核、不收新报名"的状态。

      **幂等**：重复对 `closed` 的池调用返回当前资源（`200`）。
      对 `draft` 池调用返回 `409 quota_not_open`；对 `finalized`/`archived`
      返回 `409 quota_finalized`。

      **时序**：强一致；返回后新认领立即被拒绝。会写审计日志。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: quota_id
        in: path
        required: true
        description: 名额池 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    responses:
      '200':
        description: 名额池已关闭（或本就处于 `closed`）。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/quotas.yaml#/components/schemas/Quota
            example:
              id: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              title: 2024 南京站名额
              contest:
                name: 2024 ICPC 亚洲区域赛（南京）
                kind: regional
                season: 2024-2025
              quota_total: 6
              max_claims_per_team: 2
              status: closed
              counts:
                claims_pending: 2
                claims_approved: 3
                claims_rejected: 1
                claims_withdrawn: 0
                remaining: 3
