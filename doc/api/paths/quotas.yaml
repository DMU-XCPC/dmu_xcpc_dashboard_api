quotaArchive:
  post:
    tags:
      - quotas
    operationId: archiveQuota
    summary: 归档名额池
    description: |
      **用途**：赛季结束后把名额池归档，之后一律只读。名额分配走完
      （`finalized`）之后才允许归档，避免把还在审核的池冻住。

      **权限**：需要 `quota:manage`。

      **状态**：只有 `finalized` 可归档，结果状态为 `archived`；其它状态返回
      `409 conflict`（`quota_finalized` 不适用此处）。

      **副作用**：池与其中的认领全部变为只读；`counts` 冻结；写审计记录。
      **幂等**：`Idempotency-Key` 必填；对已归档的池重放返回首次结果。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: quota_id
        in: path
        required: true
        description: 名额池 id。
        schema:
