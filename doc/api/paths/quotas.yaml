quotaClaimApprove:
  post:
    tags:
      - quotas
    operationId: approveQuotaClaim
    summary: 批准认领，管理员审核
    description: |
      需要 `quota:manage`。**这是认领生效的唯一途径**：批准后该认领占用一个名额
      （`claims_approved` 加一，`remaining` 减一）。

      **超额**：已批准数已达到 `quota_total` 时返回 `409 quota_exceeded`，
      该认领**保持 `pending`**，响应 `detail` 与认领的 `waitlist_position`
      给出候补顺位（管理员应先拒绝/让出名额或提高 `quota_total`）。

      **状态**：只允许对 `pending` 认领操作；对 `approved`/`rejected`/`withdrawn`/
      `expired` 调用返回 `409 conflict`。已 `finalized` 的池返回 `409 quota_finalized`。

      **不可撤销**：批准后本系统不提供回退端点；如需让出名额，
      由管理员提高/调整名额池或新建名额池处理。会写审计日志。

      **幂等**：`Idempotency-Key` 必填；同一键重放返回首次的批准结果。
    security:
      - bearerAuth: []
      - apiKeyAuth: []
    parameters:
      - name: quota_id
        in: path
        required: true
        description: 名额池 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: quota_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - name: claim_id
        in: path
        required: true
        description: 认领 id。
        schema:
          $ref: ../components/schemas/common.yaml#/components/schemas/Id
        example: claim_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      - $ref: ../components/parameters/common.yaml#/components/parameters/IdempotencyKey
    requestBody:
      required: true
      content:
        application/json:
          schema:
            $ref: ../components/schemas/quotas.yaml#/components/schemas/ApproveQuotaClaimRequest
          example:
            note: 名额充足，同意。
    responses:
      '200':
        description: 批准后的认领。
        headers:
          ETag:
            $ref: ../components/headers/common.yaml#/components/headers/ETag
        content:
          application/json:
            schema:
              $ref: ../components/schemas/quotas.yaml#/components/schemas/QuotaClaim
            example:
              id: claim_01J8Z5V6Q0K3M7N9P2R4T6W8X0
