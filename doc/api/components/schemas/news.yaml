components:
  schemas:
    # ------------------------------------------------------------- 公告状态机
    AnnouncementStatus:
      type: string
      description: |
        新闻板公告的状态机取值。合法迁移（其余迁移一律 `409 conflict`）：

        - `draft → scheduled`：起草中的公告在发布时带了**未来**的 `publish_at`；
        - `scheduled → published`：到达 `publish_at` 时由服务器自动发布，并发出
          `announcement.published` SSE 事件；
        - `draft | scheduled | published → archived`：删除端点的**默认**行为（归档），
          归档不可逆；
        - `published → expired`：`expires_at` 到点后由服务器自动置为过期；
        - `published | scheduled → draft`：撤销发布（`/unpublish`）。

        `archived` 与 `expired` 为终态，不会自动回到其它状态；只有物理删除
        （`DELETE ...?purge=true`）能把它们真正移除。
      enum:
        - draft
        - scheduled
        - published
        - expired
        - archived
      examples:
        - published

    AnnouncementPriority:
      type: string
      description: |
        公告优先级，用于新闻板排序、`sort=priority` 与广播模板中的提醒强度。
        排序权重为 `low < normal < high < urgent`；本字段不影响投递顺序。
      enum:
        - low
        - normal
        - high
        - urgent
      default: normal
      examples:
        - normal

    # ------------------------------------------------------------- 来源与去重
    AnnouncementSource:
      type: object
      description: |
        公告来源信息，用于追溯"谁把这条信息推进来的"。`kind` 取值如下：`manual` 人工录入、
        `agent` Agent 生成、`group_chat` 从群聊抽取、`api` 外部系统直推、
        `import` 历史数据导入。

        本对象在公告上**只读**：创建时可提交，之后不可修改。
        `kind=group_chat` 时通常同时提供 `group_name`、`message_id` 与
        `confidence` 是抽取置信度，取值 0..1；服务端不设阈值门槛，低置信度也可入库。其余字段：
        `raw_text` 保留原始文本以便人工核对。**本接口不做审核队列**：推送即入库，
        是否发布由 `publish` 决定。
      required:
        - kind
      properties:
        kind:
          type: string
          description: 来源类型。
          enum:
            - manual
            - agent
            - group_chat
            - api
            - import
          examples:
            - group_chat
        platform:
          type: string
          description: 来源平台标识，如 `qq`、`telegram`、`discord`。
          maxLength: 32
          examples:
            - qq
        url:
          type: string
          description: 原始消息/网页的可访问地址（供人工回看）。
          format: uri
          examples:
            - https://qm.qq.com/cgi-bin/qm/qr?k=example
        author:
          type: string
          description: 原始作者/发送者的展示名（不要求是系统主体）。
          maxLength: 80
          examples:
            - 李四
        group_name:
          type: string
          description: 群名称；`kind=group_chat` 时使用。
          maxLength: 120
          examples:
            - DMU-ICPC-2024
        message_id:
          type: string
          description: 平台侧消息 id，用于回溯与人工去重。
          maxLength: 128
          examples:
            - '884210'
        raw_text:
          type:
            - string
            - 'null'
          description: 抽取前的原始文本；未保留时为 `null`。
          maxLength: 4000
          examples:
            - 本周六 14:00 在 A301 进行模拟赛，请自带电脑。
        collected_at:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/Timestamp
            - type: 'null'
          description: 外部 Agent 采集到该信息的时刻；未知时为 `null`。
        confidence:
          type:
            - number
            - 'null'
          minimum: 0
          maximum: 1
          description: 自动抽取的置信度（0..1）；人工录入与未知时为 `null`。
          examples:
            - 0.82
      examples:
        - kind: group_chat
          platform: qq
          url: https://qm.qq.com/cgi-bin/qm/qr?k=example
          author: 李四
          group_name: DMU-ICPC-2024
          message_id: '884210'
          raw_text: 本周六 14:00 在 A301 进行模拟赛，请自带电脑。
          collected_at: '2024-05-06T07:00:00.000Z'
          confidence: 0.82

    # ------------------------------------------------------------------ 公告
    Announcement:
      type: object
      description: |
        新闻板公告（通知）资源。

        `body_markdown` 为 Markdown 正文；`status` 的状态机见 `AnnouncementStatus`。
        已发布公告的正文可以被修改（会提升 `revision` 并发出 `announcement.updated`
        SSE 事件），因此"已发布"不等于不可变。

        `dedup_key` 是**推送方自带**的去重键：同一 `dedup_key` 在 7 天窗口内重复推送
        不会创建新公告，详见 `CreateAnnouncementRequest`。`broadcast_channel_ids`
        是广播目标快照，`delivery_summary` 给出投递进度汇总（异步更新）。
      required:
        - id
        - title
        - body_markdown
        - category
        - tags
        - priority
        - pinned
        - status
        - visibility
        - created_at
        - updated_at
        - revision
      properties:
        id:
          $ref: ./common.yaml#/components/schemas/Id
        title:
          type: string
          description: 标题，展示在新闻板列表首行。
          minLength: 1
          maxLength: 200
          examples:
            - 2024 暑期集训安排
        body_markdown:
          type: string
          description: Markdown 正文；支持代码块与链接，服务端会做安全过滤。
          minLength: 1
          maxLength: 20000
          examples:
            - '## 时间：7 月 8 日起每周一、三、五 14:00 在 A301 训练。'
        category:
          type: string
          description: 分类，自由文本但建议取自约定集合，例如 `training`、`contest`、`notice`。
          minLength: 1
          maxLength: 40
          examples:
            - training
        tags:
          type: array
          description: 标签列表，用于过滤与展示；服务端会去重。
          uniqueItems: true
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples:
            - - 训练
              - 通知
        priority:
          $ref: '#/components/schemas/AnnouncementPriority'
        pinned:
          type: boolean
          description: |
            是否置顶。置顶公告在新闻板列表最前；置顶总数上限由服务器配置
            `announcements.max_pinned` 控制。
          examples:
            - true
        status:
          $ref: '#/components/schemas/AnnouncementStatus'
        visibility:
          $ref: ./common.yaml#/components/schemas/Visibility
        publish_at:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/Timestamp
            - type: 'null'
          description: |
            计划发布时刻；`status=scheduled` 时必有值，其它状态可为 `null`。
            设为未来时刻即为"定时发布"。
        published_at:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/Timestamp
            - type: 'null'
          description: 实际变为 `published` 的时刻；未发布时为 `null`。
        expires_at:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/Timestamp
            - type: 'null'
          description: 过期时刻；到点后服务器自动把 `published` 置为 `expired`。
        archived_at:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/Timestamp
            - type: 'null'
          description: 归档时刻；未归档时为 `null`。
        source:
          oneOf:
            - $ref: '#/components/schemas/AnnouncementSource'
            - type: 'null'
          description: 来源信息；人工在面板创建且未填写时为 `null`。
        dedup_key:
          type:
            - string
            - 'null'
          description: 推送方自带的去重键；未提供时为 `null`。
          maxLength: 128
          examples:
            - qq-group-884210
        broadcast_on_publish:
          type: boolean
          description: |
            发布时是否自动广播到 `broadcast_channel_ids`。为 `false` 时发布只影响
            新闻板，不产生投递记录。
        broadcast_channel_ids:
          type: array
          description: 广播目标渠道 id 列表（创建/更新时由 `channel_ids` 写入的快照）。
          maxItems: 50
          items:
            $ref: ./common.yaml#/components/schemas/Id
          examples:
            - - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
        author:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/PrincipalRef
            - type: 'null'
          description: |
            公告署名作者，可不同于创建者，例如代某位教练发布时填教练；
            未署名时为 `null`。
        created_by:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/PrincipalRef
            - type: 'null'
          description: |
            创建该公告的主体；外部 Agent / QQ 机器人推送时为对应的 `service` 主体。
        delivery_summary:
          oneOf:
            - type: object
              description: 广播投递进度汇总；异步更新，未广播时为全 0。
              required:
                - pending
                - sent
                - failed
              properties:
                pending:
                  type: integer
                  minimum: 0
                  description: 等待投递或等待重试的条数。
                sent:
                  type: integer
                  minimum: 0
                  description: 已成功投递的条数。
                failed:
                  type: integer
                  minimum: 0
                  description: 重试耗尽后最终失败的条数。
              examples:
                - pending: 0
                  sent: 2
                  failed: 1
            - type: 'null'
          description: |
            投递汇总；从未广播过的公告为 `null`。字段为异步更新的近似值，
            精确逐条状态见 `GET /announcements/{announcement_id}/deliveries`。
        created_at:
          $ref: ./common.yaml#/components/schemas/Timestamp
        updated_at:
          $ref: ./common.yaml#/components/schemas/Timestamp
        revision:
          type: string
          description: 版本标记，与 `ETag` 值一致；写入时可用 `If-Match` 做乐观并发控制。
          examples:
            - '3'
      examples:
        - id: ann_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          title: 2024 暑期集训安排
          body_markdown: '## 时间：7 月 8 日起每周一、三、五 14:00 在 A301 训练。'
          category: training
          tags:
            - 训练
            - 通知
          priority: normal
          pinned: true
          status: published
          visibility: members
          publish_at: null
          published_at: '2024-05-06T07:08:09.123Z'
          expires_at: null
          archived_at: null
          source:
            kind: manual
          dedup_key: null
          broadcast_on_publish: true
          broadcast_channel_ids:
            - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          author: null
          created_by:
            id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
            username: alice
            display_name: 张三
            kind: human
          delivery_summary:
            pending: 0
            sent: 2
            failed: 1
          created_at: '2024-05-06T07:00:00.000Z'
          updated_at: '2024-05-06T07:08:09.123Z'
          revision: '3'

    # -------------------------------------------------------------- 请求体
    CreateAnnouncementRequest:
      type: object
      description: |
        创建公告。**这是外部 Agent / QQ 机器人主动推送的入口**：推送即入库，
        没有审核队列；是否对外可见由 `publish` 与 `publish_at` 决定。

        权限语义：

        - `publish=false`，默认只需 `announcement:write`，公告以 `draft` 落库；
        - `publish=true` 需要 `announcement:publish`，否则 `403 insufficient_scope`
          ，不会静默降级为草稿；
        - `publish=true` 且 `broadcast=true` 时还需 `channel:manage`，否则同样
          `403 insufficient_scope`。

        时序与去重：

        - `publish=true` 且 `publish_at` 为空或已过去 → 状态直接为 `published`，
          立即发 `announcement.published` SSE 事件；
        - `publish=true` 且 `publish_at` 为未来时刻 → 状态为 `scheduled`，到点由
          服务器发布；`publish_at` 不能早于创建时刻。
        - `dedup_key` 在 **7 天**窗口内重复出现时，不创建新资源，返回 **200** 与
          已存在的公告（201 表示本次确实新建）；命中去重时不重复广播。
        - `broadcast=true` 时广播被排成异步任务，`delivery_summary` 反映进度。
      required:
        - title
        - body_markdown
        - category
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 标题。
          examples:
            - 2024 暑期集训安排
        body_markdown:
          type: string
          minLength: 1
          maxLength: 20000
          description: Markdown 正文。
          examples:
            - '## 时间：7 月 8 日起每周一、三、五 14:00 在 A301 训练。'
        category:
          type: string
          minLength: 1
          maxLength: 40
          description: 分类，例如 `training`、`contest`、`notice`。
          examples:
            - training
        tags:
          type: array
          description: 标签列表；省略时为空列表。
          uniqueItems: true
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples:
            - - 训练
              - 通知
        priority:
          $ref: '#/components/schemas/AnnouncementPriority'
        pinned:
          type: boolean
          default: false
          description: 是否置顶；超过 `announcements.max_pinned` 上限时返回 `409 conflict`。
        visibility:
          $ref: ./common.yaml#/components/schemas/Visibility
        publish:
          type: boolean
          default: false
          description: |
            是否立即（或按 `publish_at` 定时）发布。为 `true` 时必须具备
            `announcement:publish`，否则 `403 insufficient_scope`。
        publish_at:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/Timestamp
            - type: 'null'
          description: |
            计划发布时刻（UTC RFC 3339）。仅当 `publish=true` 时有意义：为未来时刻
            则状态为 `scheduled`；早于当前时刻或省略时立即发布。
        expires_at:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/Timestamp
            - type: 'null'
          description: 过期时刻；到点后由服务器自动把 `published` 置为 `expired`。
        broadcast:
          type: boolean
          default: false
          description: |
            发布后是否广播到 `channel_ids`。需要 `channel:manage`；
            `publish=false` 时该字段被忽略（不产生投递）。
        channel_ids:
          type: array
          description: 广播目标渠道 id 列表；省略时沿用公告已有的目标（首次创建时为空）。
          maxItems: 50
          items:
            $ref: ./common.yaml#/components/schemas/Id
          examples:
            - - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
        dedup_key:
          type:
            - string
            - 'null'
          description: |
            推送方自带的去重键（8..128 字符）。同一键在 7 天内重复推送会命中已有公告，
            此时返回 `200` 而不是 `201`。
          minLength: 8
          maxLength: 128
          examples:
            - qq-group-884210
        source:
          oneOf:
            - $ref: '#/components/schemas/AnnouncementSource'
            - type: 'null'
          description: 来源信息；外部 Agent / 群聊机器人推送时应填写，便于追溯。
      examples:
        - title: 2024 暑期集训安排
          body_markdown: '## 时间：7 月 8 日起每周一、三、五 14:00 在 A301 训练。'
          category: training
          tags:
            - 训练
          priority: normal
          pinned: false
          visibility: members
          publish: true
          publish_at: '2024-05-07T00:00:00.000Z'
          expires_at: null
          broadcast: true
          channel_ids:
            - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          dedup_key: qq-group-884210
          source:
            kind: group_chat
            platform: qq
            group_name: DMU-ICPC-2024
            message_id: '884210'
            confidence: 0.82

    UpdateAnnouncementRequest:
      type: object
      description: |
        局部更新公告（缺省字段不变）。**不含 `publish`、`source`、`dedup_key`**：
        发布状态走 `/publish` 与 `/unpublish`，来源与去重键创建后不可改。

        - 只提供要改的字段；`null` 表示清空该字段（`publish_at`/`expires_at`）。
        - 正文修改对**已发布**公告同样允许：会提升 `revision` 并向 SSE 推送
          `announcement.updated` 事件，订阅方应据此刷新本地副本。
        - 已发布公告不允许再改 `publish_at`（返回 `409 conflict`）。
        - `pinned=true` 时置顶总数不得超过 `announcements.max_pinned`。
      minProperties: 1
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
          description: 标题。
          examples:
            - 2024 暑期集训安排（更新）
        body_markdown:
          type: string
          minLength: 1
          maxLength: 20000
          description: Markdown 正文。
          examples:
            - '## 时间：改为 7 月 9 日起每周二、四 14:00 在 A301 训练。'
        category:
          type: string
          minLength: 1
          maxLength: 40
          description: 分类。
          examples:
            - training
        tags:
          type: array
          description: 标签列表；提供时整体替换。
          uniqueItems: true
          maxItems: 20
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples:
            - - 训练
              - 通知
        priority:
          $ref: '#/components/schemas/AnnouncementPriority'
        pinned:
          type: boolean
          description: 是否置顶；置顶数量上限见 `announcements.max_pinned`。
        visibility:
          $ref: ./common.yaml#/components/schemas/Visibility
        publish_at:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/Timestamp
            - type: 'null'
          description: |
            计划发布时刻；仅 `draft`/`scheduled` 可改，`published` 公告改此字段返回
            `409 conflict`。`null` 表示取消定时（`scheduled → draft`）。
        expires_at:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/Timestamp
            - type: 'null'
          description: 过期时刻；`null` 表示清除过期时间。
        broadcast:
          type: boolean
          description: |
            是否在下次发布时广播（写入 `broadcast_on_publish`）；需要 `channel:manage`。
        channel_ids:
          type: array
          description: 广播目标渠道 id 列表；提供时整体替换。
          maxItems: 50
          items:
            $ref: ./common.yaml#/components/schemas/Id
          examples:
            - - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      examples:
        - body_markdown: '## 时间：改为 7 月 9 日起每周二、四 14:00 在 A301 训练。'
          tags:
            - 训练
          pinned: true

    PublishAnnouncementRequest:
      type: object
      description: |
        发布公告的选项。`draft`/`scheduled` → `published`，并带未来 `publish_at` 时为
        `scheduled`；已发布公告重复调用是幂等的（状态不变，`publish_at` 不可再改）。
      properties:
        publish_at:
          oneOf:
            - $ref: ./common.yaml#/components/schemas/Timestamp
            - type: 'null'
          description: |
            计划发布时刻；为未来时刻则状态为 `scheduled`，到点由服务器自动发布并发出
            `announcement.published` SSE 事件。省略或 `null` 表示立即发布。
        broadcast:
          type: boolean
          default: false
          description: 发布后是否立即广播；需要 `channel:manage`。
        channel_ids:
          type: array
          description: 本次广播的目标渠道；省略时使用公告已保存的目标列表。
          maxItems: 50
          items:
            $ref: ./common.yaml#/components/schemas/Id
          examples:
            - - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
      examples:
        - publish_at: '2024-05-07T00:00:00.000Z'
          broadcast: true
          channel_ids:
            - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0

    PinAnnouncementRequest:
      type: object
      description: |
        设置或取消置顶。置顶公告在新闻板列表最前；置顶总量上限由服务器配置
        `announcements.max_pinned` 控制，超过时返回 `409 conflict`（不会挤掉已有置顶）。
      required:
        - pinned
      properties:
        pinned:
          type: boolean
          description: '`true` 置顶，`false` 取消置顶。重复设置同一值是幂等的。'
          examples:
            - true
      examples:
        - pinned: true

    BroadcastAnnouncementRequest:
      type: object
      description: |
        手动触发一次广播（异步任务）。可选在 `test=true` 时只投递到测试渠道，
        用于验证模板与连通性而不打扰真实群。
      properties:
        channel_ids:
          type: array
          description: 目标渠道 id 列表；省略时使用公告已保存的目标列表。
          maxItems: 50
          items:
            $ref: ./common.yaml#/components/schemas/Id
          examples:
            - - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
        test:
          type: boolean
          default: false
          description: |
            为 `true` 时只投递到处于 `test` 模式的渠道，且**不改变公告状态**、
            不计入正式投递统计。
      examples:
        - channel_ids:
            - chn_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          test: false

    PagedAnnouncement:
      description: 公告的偏移分页结果。
