    # ====================================================== ingest 写入通道
    IngestSubmissionItem:
      type: object
      description: |
        单条提交上报。`submission_id` 是外部平台的原始提交编号，
        `(judge, submission_id)` 即该记录的自然键——同一自然键重复上报会被判为
        `duplicate` 而不是错误，也不会覆盖已存记录。
      required:
        - judge
        - submission_id
        - handle
        - problem
        - submitted_at
      properties:
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        submission_id:
          type: string
          description: 外部平台的原始提交编号。
          minLength: 1
          maxLength: 128
          examples:
            - '223456789'
        handle:
          type: string
          description: 提交者的 OJ 账号名（外部平台原始值）。
          minLength: 1
          maxLength: 64
          examples:
            - tourist
        problem:
          $ref: '#/components/schemas/OjProblemRef'
          description: |
            题目引用；其中 `judge` 与 `external_id` 必填（自然键 `(judge, external_id)`），
            其余字段可留空由服务端补全或后续上报补齐。
        verdict:
          oneOf:
            - $ref: '#/components/schemas/OjVerdict'
            - type: 'null'
          description: 归一化评测结果；结果未出或无法归类时省略。
        verdict_raw:
          type: [string, 'null']
          description: 平台原始评测结果文本。
          examples:
            - OK
        language:
          type: [string, 'null']
          description: 提交语言（平台原始写法）。
          examples:
            - GNU C++17
        submitted_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
          description: |
            平台上的提交时刻。允许**乱序**（早于已存记录），但必须在容忍区间
            `now-3y .. now+1d` 内，否则该条被判为 `rejected`。
        contest_id:
          type: [string, 'null']
          description: 外部平台的原始比赛编号；练习提交省略。
          examples:
            - '1873'
        contest_name:
          type: [string, 'null']
          description: 比赛名称，用于在服务器侧补全比赛信息。
          examples:
            - Codeforces Round 898 (Div. 4)
        is_first_ac:
          type: boolean
          description: 采集器判断的"是否首次 AC"提示；服务端仍会按自然键独立判定。
      examples:
        - judge: codeforces
          submission_id: '223456789'
          handle: tourist
          problem:
            judge: codeforces
            external_id: 1873A
            title: Short Sort
            url: https://codeforces.com/contest/1873/problem/A
          verdict: accepted
          verdict_raw: OK
          language: GNU C++17
          submitted_at: '2024-05-06T06:59:12.000Z'
          contest_id: '1873'
          contest_name: Codeforces Round 898 (Div. 4)
          is_first_ac: true

    IngestSubmissionsRequest:
      type: object
      description: |
        提交记录的批量上报请求。**自然键 `(judge, submission_id)`**：
        同一自然键的条目只写一次，重复上报记为 `duplicate`，不是错误。

        单条校验失败只影响该条（记为 `rejected`），其余照常写入，整体仍返回 `200`；
        整个批次条目数超过 `capabilities.ingest_batch_max` 时返回 `413`，**整批不入库**。
        条目允许乱序，`submitted_at` 可以早于服务器已存记录。
      required:
        - items
      properties:
        items:
          type: array
          description: 本次上报的提交条目，至少 1 条、至多 500 条（上限即 `ingest_batch_max`）。
          minItems: 1
          maxItems: 500
          items:
            $ref: '#/components/schemas/IngestSubmissionItem'
        crawler_run_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Id'
            - type: 'null'
          description: |
            本次上报对应的采集器运行 id，见 `POST /crawler/runs` 返回的 `CrawlerRun`，
            用于把入库条目与某次抓取关联起来；不关联时省略或传 `null`。
      examples:
        - crawler_run_id: run_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          items:
            - judge: codeforces
              submission_id: '223456789'
              handle: tourist
              problem:
                judge: codeforces
                external_id: 1873A
                title: Short Sort
              verdict: accepted
              verdict_raw: OK
              language: GNU C++17
              submitted_at: '2024-05-06T06:59:12.000Z'
              contest_id: '1873'
              contest_name: Codeforces Round 898 (Div. 4)
              is_first_ac: true
            - judge: codeforces
              submission_id: '223456790'
              handle: tourist
              problem:
                judge: codeforces
                external_id: 1873B
              verdict: wrong_answer
              verdict_raw: WRONG_ANSWER
              language: GNU C++17
              submitted_at: '2024-05-06T07:00:03.000Z'
              contest_id: '1873'

    IngestRatingRecordItem:
      type: object
      description: |
        **单条 rating 上报：只需要"某时刻的 rating"**。自然键带 `contest_id` 时为
        `(judge, handle, contest_id)`，省略时退化为 `(judge, handle, at)`；
        同一自然键重复上报记为 `duplicate`，不是错误。

        `delta` **不是上报字段**：它由服务端按同一账号的相邻记录派生。平台没有比赛
        概念时，例如按周期抓取的 rating 快照，只给 `rating` 与 `at` 即可。
      required:
        - judge
        - handle
        - rating
        - at
      properties:
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        handle:
          type: string
          description: OJ 账号名（外部平台原始值）。
          minLength: 1
          maxLength: 64
          examples:
            - tourist
        contest_id:
          type: string
          description: |
            外部平台的原始比赛编号。**可省略**——省略时自然键退化为
            `(judge, handle, at)`。
          minLength: 1
          maxLength: 128
          examples:
            - '1873'
        contest_name:
          type: [string, 'null']
          description: 比赛名称，用于补全比赛信息。
          examples:
            - Codeforces Round 898 (Div. 4)
        rating:
          type: integer
          description: 该时刻的 rating（观测值本身）。
          examples:
            - 3721
        max_rating:
          type: [integer, 'null']
          description: 该时刻的历史最高 rating；平台未提供时省略。
          examples:
            - 3800
        rank:
          type: [integer, 'null']
          description: 本场名次。
          examples:
            - 7
        performance:
          type: [integer, 'null']
          description: 本场表现分。
          examples:
            - 3810
        at:
          $ref: './common.yaml#/components/schemas/Timestamp'
          description: rating 生效时刻，必须在容忍区间 `now-3y .. now+1d` 内。
      examples:
        - judge: codeforces
          handle: tourist
          contest_id: '1873'
          contest_name: Codeforces Round 898 (Div. 4)
          rating: 3721
          max_rating: 3800
          rank: 7
          performance: 3810
          at: '2023-09-21T16:35:00.000Z'
        - judge: atcoder
          handle: tourist
          rating: 2843
          at: '2024-05-01T00:00:00.000Z'

