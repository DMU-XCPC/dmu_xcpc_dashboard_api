        `status` 取值：`accepted`（新写入）、`duplicate`（自然键已存在，**不是错误**）、
        `rejected`（该条校验失败，未写入）。`rejected` 时 `code` / `message` /
        `pointer` 给出原因，`pointer` 是 RFC 6901 JSON Pointer，例如 `/items/3/submitted_at`。
      required:
        - index
        - status
      properties:
        index:
          type: integer
          minimum: 0
          description: 该条在请求 `items` 数组中的下标（从 0 开始）。
          examples:
            - 0
        status:
          type: string
          description: 该条的处理结果。
          enum:
            - accepted
            - duplicate
            - rejected
          examples:
            - accepted
        id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Id'
            - type: 'null'
          description: |
            写入或命中已有记录后的资源 id；`rejected` 时为 `null`。
        code:
          type: [string, 'null']
          description: |
            失败子码（`rejected` 时）。与 `ProblemCode` 对齐的取值如
            `validation_failed`、`judge_not_supported`、`unprocessable_entity`；
            重复项不是错误，因此不会出现与去重相关的 code。
          examples:
            - judge_not_supported
        message:
          type: [string, 'null']
          description: 面向人的失败说明。
          examples:
            - judge=other 未在 capabilities.judges 内启用
        pointer:
          type: [string, 'null']
          description: 指向请求体中出错位置的 JSON Pointer。
          examples:
            - /items/3/judge
      examples:
        - index: 0
          status: accepted
          id: sub_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          code: null
          message: null
          pointer: null

    IngestResult:
      type: object
      description: |
        ingest 批次的处理结果。**HTTP 200 + 逐条 `items` 结果表示部分成功**：
        批次已被接受，`accepted` / `duplicates` / `rejected` 是各类条目的计数，
        `items` 与请求条目按 `index` 一一对应。

        **幂等由自然键保证**（提交 `(judge, submission_id)`、rating
        `(judge, handle, contest_id)`、快照 `(judge, handle, captured_at)`、
        题目 `(judge, external_id)`）：重复条目记为 `duplicate`，**不是错误**，
        也不会覆盖已存记录。整个批次超过 `ingest_batch_max` 时返回
        `413 payload_too_large`，整批拒绝且无副作用；单条校验失败
        ，例如 `submitted_at` 超出 `now-3y .. now+1d`、`judge` 未启用只把该条记为
        `rejected`，其余照常写入。

        **乱序接受**：`submitted_at` / `at` / `captured_at` 允许早于已存记录，
        服务端按自然键 upsert，不要求顺序。

        **时序**：写入立即可被后续 ingest 感知，但统计、榜单与公开查询是**最终一致**的；
        `materialized_at` 给出聚合结果可见的时刻（`x-freshness-bound: PT15M`）。
      required:
        - accepted
        - duplicates
        - rejected
        - items
      properties:
        accepted:
          type: integer
          minimum: 0
          description: 新写入的条目数。
          examples:
            - 2
        duplicates:
          type: integer
          minimum: 0
          description: 自然键已存在、被判为重复的条目数，不是错误。
          examples:
            - 1
        rejected:
          type: integer
          minimum: 0
          description: 校验失败、未写入的条目数；`items` 中对应条目 `status=rejected`。
          examples:
            - 1
        items:
          type: array
          description: 逐条处理结果，与请求 `items` 按 `index` 一一对应。
          items:
            $ref: '#/components/schemas/IngestItemResult'
        crawler_run_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Id'
            - type: 'null'
          description: 请求中携带的采集器运行 id 回显；未携带时为 `null`。
        materialized_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            本批数据在聚合视图（统计、榜单、`/oj/*` 查询）中可见的时刻；
            为 `null` 表示尚未排入物化，客户端应按 `x-freshness-bound` 退避轮询。
      examples:
        - accepted: 2
          duplicates: 1
          rejected: 1
          crawler_run_id: run_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          materialized_at: '2024-05-06T07:15:00.000Z'
          items:
            - index: 0
              status: accepted
              id: sub_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              code: null
              message: null
              pointer: null
            - index: 1
              status: duplicate
              id: sub_01J8Z5V6Q0K3M7N9P2R4T6W8X1
              code: null
              message: null
              pointer: null
            - index: 2
              status: accepted
              id: sub_01J8Z5V6Q0K3M7N9P2R4T6W8X2
              code: null
              message: null
              pointer: null
            - index: 3
              status: rejected
              id: null
              code: validation_failed
              message: submitted_at 必须落在 now-3y .. now+1d 之内
              pointer: /items/3/submitted_at

    # ========================================================== 采集器配置
    ProxyHealth:
      type: object
      description: |
        代理服务器的最近一次健康探测结果。`unknown` 表示尚未探测或探测结果已过期，
        此时采集器仍可尝试使用该代理，按 `strategy` 决定顺序。
      required:
        - state
      properties:
        state:
          type: string
          description: 健康状态。
          enum:
            - unknown
            - healthy
            - unhealthy
          examples:
            - healthy
        checked_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: 最近一次探测时刻；从未探测为 `null`。
        latency_ms:
          type: [integer, 'null']
          description: 最近一次探测的往返毫秒数；探测失败或未探测为 `null`。
          minimum: 0
          examples:
            - 128
        last_error:
          type: [string, 'null']
          description: 最近一次失败的原因摘要；健康时为 `null`。
          examples:
            - 'dial tcp 10.0.0.9:1080: connect: connection refused'
      examples:
        - state: healthy
          checked_at: '2024-05-06T07:00:00.000Z'
          latency_ms: 128
          last_error: null

    ProxyServer:
      type: object
      description: |
        一个可选的代理服务器。采集器**先直连目标平台，只有在 `direct_timeout` 内失败后**
        才按 `ProxyConfig.strategy` 使用本列表中的代理。

        `password` 是**只写字段（writeOnly）**：只在 `PATCH /crawler/config` 的请求体里出现，
        **任何响应（包括 `GET /crawler/config`）都绝不回传明文**；客户端通过
        `has_password` 判断该代理是否已配置口令。`username` 会正常回传。
      required:
        - id
        - label
        - url
        - enabled
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        label:
          type: string
          description: 人类可读的代理名称，用于在日志与状态里识别。
          minLength: 1
          maxLength: 64
          examples:
            - hk-1
        url:
          type: string
          description: |
            代理地址，形如 `socks5://host:1080`、`http://host:3128`、
            `https://user@host:443`。支持 `socks5`、`socks5h`、`http`、`https`。
          pattern: '^(socks5h?|https?)://[^\s]+$'
          examples:
            - socks5://10.0.0.9:1080
        username:
          type: [string, 'null']
          description: 代理认证用户名；无需认证时为 `null`。响应中正常回传。
          examples:
            - crawler
        password:
          type: [string, 'null']
          writeOnly: true
          description: |
            代理认证口令明文。**只写**：仅在 `PATCH /crawler/config` 请求体中出现，
            任何响应都返回 `null` 或不返回该字段，用 `has_password` 代替。
            传 `null` 表示清除已存口令。
          examples:
            - s3cr3t-proxy-pass
        has_password:
          type: boolean
          readOnly: true
          description: 服务端是否已保存该代理的口令；只读，由服务端计算。
          examples:
            - true
        enabled:
          type: boolean
          description: 该代理是否参与回退；`false` 时被完全跳过。
        priority:
          type: integer
          minimum: 0
          description: "优先级，数值越小越先尝试（`strategy: failover` 时生效）。"
          default: 100
          examples:
            - 10
        health:
          oneOf:
            - $ref: '#/components/schemas/ProxyHealth'
            - type: 'null'
          description: 最近一次健康探测结果；从未探测为 `null`。
      examples:
        - id: pxy_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          label: hk-1
          url: socks5://10.0.0.9:1080
          username: crawler
          has_password: true
          enabled: true
          priority: 10
          health:
            state: healthy
            checked_at: '2024-05-06T07:00:00.000Z'
            latency_ms: 128
            last_error: null

    ProxyConfig:
      type: object
      description: |
        代理回退配置。**仅当直连失败时使用代理**：采集器先按 `direct_timeout`
        直连目标平台；只有连接失败、TLS 错误、超时，或返回 `429`/`5xx` 时，
        才按 `strategy` 从 `proxies` 中挑选 `enabled: true` 的服务器重试。

        - `failover`：按 `priority` 升序依次尝试，直到成功或列表耗尽。
        - `round_robin`：在可用代理间轮转，分散出口 IP。
        - `always`：跳过直连，始终走代理，仅用于直连完全不可达的部署。

        `no_proxy` 中的主机名匹配的请求永不使用代理。
      required:
        - enabled
        - strategy
        - direct_timeout
        - proxies
      properties:
        enabled:
          type: boolean
          description: 代理回退总开关；`false` 时即使直连失败也不使用任何代理。
        strategy:
          type: string
          description: 代理选择策略。
          enum:
            - failover
            - round_robin
            - always
          examples:
            - failover
        direct_timeout:
          $ref: './common.yaml#/components/schemas/Duration'
          description: |
            单次直连的超时，默认 `PT10S`。**只有超过该时长仍未成功才回退代理**，
            因此该值应小于平台的整体请求超时。
        proxies:
          type: array
          description: 候选代理列表；顺序由 `priority` 与 `strategy` 共同决定。
          items:
            $ref: '#/components/schemas/ProxyServer'
        no_proxy:
          type: array
          description: 永不使用代理的主机名后缀列表，例如 `*.dmu.edu.cn`；缺省为空数组。
          items:
            type: string
          examples:
            - - '*.dmu.edu.cn'
              - localhost
      examples:
        - enabled: true
          strategy: failover
          direct_timeout: PT10S
          no_proxy:
            - '*.dmu.edu.cn'
          proxies:
            - id: pxy_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              label: hk-1
              url: socks5://10.0.0.9:1080
              username: crawler
              has_password: true
              enabled: true
              priority: 10
              health:
                state: healthy
                checked_at: '2024-05-06T07:00:00.000Z'
                latency_ms: 128
                last_error: null

    CrawlerJudgeConfig:
      type: object
      description: |
        单个平台的采集配置。`interval` 覆盖全局 `schedule.interval`；
        `extra` 存放平台特有参数，例如需要登录的平台的账号名，服务端原样透传给采集器。
      required:
        - judge
        - enabled
      properties:
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        enabled:
          type: boolean
          description: 是否采集该平台；`false` 时采集器应跳过该平台。
        interval:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Duration'
            - type: 'null'
          description: 该平台的采集间隔；`null` 表示沿用全局 `schedule.interval`。
        max_pages:
          type: [integer, 'null']
          minimum: 1
          description: 单次运行最多抓取的列表页数，用于限制回填深度；`null` 表示不限制。
          examples:
            - 20
        extra:
          type: [object, 'null']
          additionalProperties: true
          description: 平台特有的键值对，由服务端原样下发，契约不约束其结构。
          examples:
            - handle_batch_size: 25
      examples:
        - judge: codeforces
          enabled: true
          interval: PT15M
          max_pages: 20
          extra:
            handle_batch_size: 25

    CrawlerConfig:
      type: object
      description: |
        采集器/采集器的完整配置。**由服务器持有并下发**：完全独立的采集器通过
        `GET /crawler/config` 拉取本对象，据此决定采集哪些平台、以什么频率采集、
        直连失败后回退到哪些代理。

        `mode` 由服务器能力决定、**客户端只读**：`embedded` 表示服务器代管采集器运行
        （`POST /crawler/trigger` 可用），`external` 表示采集器完全独立
        （只走 ingest 写入通道或与服务器共用数据库）。

        配置变更在服务器侧是**强一致**的（`PATCH` 返回后下一次 `GET` 立即看到新值），
        但采集器在**下一次拉取配置之前仍在使用旧值**，因此生效滞后上界为
        `schedule.interval`，默认 `PT30M`。
      required:
        - revision
        - mode
        - enabled
        - judges
        - schedule
        - rate_limit
        - proxy
        - updated_at
      properties:
        revision:
          type: string
          description: 配置版本标记，与 `GET /crawler/config` 的 `ETag` 一致；`PATCH` 时用 `If-Match` 做乐观并发控制。
          examples:
            - '7'
        mode:
          type: string
          description: |
            运行形态，由服务器能力决定、客户端只读：
            `embedded`（服务器代管，`POST /crawler/trigger` 可用）或
            `external`（采集器独立运行，代管触发返回 `409 crawler_not_embedded`）。
          enum:
            - embedded
            - external
          examples:
            - embedded
        enabled:
          type: boolean
          description: 采集总开关；`false` 时调度器不再触发任何平台，外部采集器应停止上报并进入休眠。
        judges:
          type: array
          description: |
            各平台的采集配置。只允许出现 `GET /meta` 的 `capabilities.judges` 中
            已启用的平台，否则 `PATCH` 返回 `422 validation_failed`。
          items:
            $ref: '#/components/schemas/CrawlerJudgeConfig'
        schedule:
          type: object
          description: |
            默认调度参数，可被单个 `judges[].interval` 覆盖。
            `interval` 默认 `PT30M`、`jitter` 默认 `PT2M`、`timezone` 默认 `Asia/Shanghai`。
          required:
            - interval
            - jitter
            - timezone
          properties:
            interval:
              $ref: './common.yaml#/components/schemas/Duration'
              description: 相邻两次采集的基准间隔，默认 `PT30M`。
            jitter:
              $ref: './common.yaml#/components/schemas/Duration'
              description: 在上一次运行结束后随机追加的抖动上限，默认 `PT2M`，避免固定节奏被平台限流。
            timezone:
              type: string
              description: 解释 `active_hours` 的 IANA 时区名，默认 `Asia/Shanghai`。
              examples:
                - Asia/Shanghai
            active_hours:
              type: object
              description: |
                允许采集的时间窗，按 `timezone` 解释，`from` 含、`to` 不含；
                省略表示全天可采集，跨零点窗口，例如 `22:00`–`06:00`也合法。
              required:
                - from
                - to
              properties:
                from:
                  type: string
                  pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                  description: 窗口起始时刻 `HH:MM`（24 小时制，含）。
                  examples:
                    - '08:00'
                to:
                  type: string
                  pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                  description: 窗口结束时刻 `HH:MM`（24 小时制，不含）。
                  examples:
                    - '23:30'
        rate_limit:
          type: object
          description: 采集器对单个平台的默认请求节流；平台特有的更严限制由采集器自行遵守。
          required:
            - requests_per_minute
            - concurrency
          properties:
            requests_per_minute:
              type: integer
              minimum: 1
              maximum: 600
              description: 对同一平台每分钟最多发起的 HTTP 请求数。
              examples:
                - 60
            concurrency:
              type: integer
              minimum: 1
              maximum: 16
              description: 对同一平台允许的最大并发请求数。
              examples:
                - 2
        proxy:
          $ref: '#/components/schemas/ProxyConfig'
        retention:
          type: object
          description: 采集结果的保留期；超期数据由服务端清理，客户端不得依赖更早的历史。
          required:
            - submissions
            - runs
          properties:
            submissions:
              $ref: './common.yaml#/components/schemas/Duration'
              description: |
                提交/rating/快照原始记录的保留期。**权威值见 `Config.retention.submissions`**
                （默认 `P2Y`，即约 730 天）；这里只是回显，避免与配置各说各话。
            runs:
              $ref: './common.yaml#/components/schemas/Duration'
              description: 采集器运行记录的保留期，默认 `P90D`。
        updated_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
      examples:
        - revision: '7'
          mode: embedded
          enabled: true
          judges:
            - judge: codeforces
              enabled: true
              interval: PT15M
              max_pages: 20
              extra: null
            - judge: atcoder
              enabled: true
              interval: null
              max_pages: null
              extra: null
          schedule:
            interval: PT30M
            jitter: PT2M
            timezone: Asia/Shanghai
            active_hours:
              from: '08:00'
              to: '23:30'
          rate_limit:
            requests_per_minute: 60
            concurrency: 2
          proxy:
            enabled: true
            strategy: failover
            direct_timeout: PT10S
            no_proxy:
              - '*.dmu.edu.cn'
            proxies:
              - id: pxy_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                label: hk-1
                url: socks5://10.0.0.9:1080
                username: crawler
                has_password: true
                enabled: true
                priority: 10
                health: null
          retention:
            submissions: P2Y
            runs: P90D
          updated_at: '2024-05-06T07:00:00.000Z'

    CrawlerConfigPatch:
      type: object
      description: |
        采集器配置的局部更新请求。未出现的字段保持不变；出现的字段**整体替换**
        （`proxy` 是整体替换，包括其中的 `proxies` 数组——要新增代理就提交完整数组，
        数组里被移除的代理会被删除）。

        `mode` 由服务器能力决定，不在本结构内，提交它会被 `422 validation_failed` 拒绝。
        变更在服务器侧强一致生效；外部采集器在下一次 `GET /crawler/config` 后才会使用新值。
      minProperties: 1
      additionalProperties: false
      properties:
        enabled:
          type: boolean
          description: 采集总开关。
        judges:
          type: array
          description: |
            平台采集配置的完整列表（整体替换）。只能包含 `capabilities.judges` 中已启用的平台。
          items:
            $ref: '#/components/schemas/CrawlerJudgeConfig'
        schedule:
          type: object
          description: 默认调度参数（整体替换）。
          required:
            - interval
            - jitter
            - timezone
          properties:
            interval:
              $ref: './common.yaml#/components/schemas/Duration'
              description: 相邻两次采集的基准间隔。
            jitter:
              $ref: './common.yaml#/components/schemas/Duration'
              description: 采集抖动的上限。
            timezone:
              type: string
              description: 解释 `active_hours` 的 IANA 时区名。
              examples:
                - Asia/Shanghai
            active_hours:
              type: object
              description: 允许采集的时间窗（`from` 含、`to` 不含）。
              required:
                - from
                - to
              properties:
                from:
                  type: string
                  pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                  examples:
                    - '08:00'
                to:
                  type: string
                  pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$'
                  examples:
                    - '23:30'
        rate_limit:
          type: object
          description: 单平台请求节流（整体替换）。
          required:
            - requests_per_minute
            - concurrency
          properties:
            requests_per_minute:
              type: integer
              minimum: 1
              maximum: 600
              examples:
                - 60
            concurrency:
              type: integer
              minimum: 1
              maximum: 16
              examples:
                - 2
        proxy:
          $ref: '#/components/schemas/ProxyConfig'
        retention:
          type: object
          description: 采集结果保留期（整体替换）。
          required:
            - submissions
            - runs
          properties:
            submissions:
              $ref: './common.yaml#/components/schemas/Duration'
              description: 原始采集记录的保留期。
            runs:
              $ref: './common.yaml#/components/schemas/Duration'
              description: 采集器运行记录的保留期。
      examples:
        - enabled: true
          proxy:
            enabled: true
            strategy: failover
            direct_timeout: PT10S
            no_proxy:
              - '*.dmu.edu.cn'
            proxies:
              - id: pxy_01J8Z5V6Q0K3M7N9P2R4T6W8X0
                label: hk-1
                url: socks5://10.0.0.9:1080
                username: crawler
                password: s3cr3t-proxy-pass
                enabled: true
                priority: 10

    # ========================================================== 采集器运行
    CrawlerRunState:
      type: string
      description: |
        采集器运行的状态机：`queued`（已接受、等待执行）→ `running` →
        `succeeded`（全部条目成功）或 `failed`（整体失败，无有效产出）。
        `partial` 表示运行本身结束但存在被拒绝/失败的条目（批次部分成功），
        是终态之一。终态不可再回到 `queued`/`running`。
      enum:
        - queued
        - running
        - succeeded
        - failed
        - partial
      examples:
        - succeeded

    CrawlerRunTrigger:
      type: string
      description: |
        运行由谁触发：`schedule`（服务器调度器按 `schedule` 自动触发）、
        `manual`（管理员在服务器侧手工触发）、`api`（外部采集器通过 API 上报自己的运行）。
      enum:
        - schedule
        - manual
        - api
      examples:
        - schedule

    CrawlerRunCounts:
      type: object
      description: |
        一次采集运行的条目计数。`fetched` 是从平台取到的条目数，
        `accepted` / `duplicates` / `rejected` 与 `IngestResult` 的语义一致
        （重复不是错误），`failed` 是因网络或解析原因未能处理的条目数。
      required:
        - fetched
        - accepted
        - duplicates
        - rejected
        - failed
      properties:
        fetched:
          type: integer
          minimum: 0
          description: 从平台抓取到的原始条目数。
          examples:
            - 120
        accepted:
          type: integer
          minimum: 0
          description: 新写入服务器的条目数。
          examples:
            - 96
        duplicates:
          type: integer
          minimum: 0
          description: 因自然键已存在而被判为重复的条目数，不是错误。
          examples:
            - 23
        rejected:
          type: integer
          minimum: 0
          description: 校验失败、未写入的条目数。
          examples:
            - 1
        failed:
          type: integer
          minimum: 0
          description: 因网络/解析失败而未处理的条目数。
          examples:
            - 0
      examples:
        - fetched: 120
          accepted: 96
          duplicates: 23
          rejected: 1
          failed: 0

    CrawlerRun:
      type: object
      description: |
        一次采集运行的记录。既可能是服务器代管的运行（`POST /crawler/trigger` 触发），
        也可能是外部采集器通过 `POST /crawler/runs` 上报的自己的运行——
        两条路径互不影响，只在本资源里汇合。

        `report_note` 是上报方附加的自由文本说明；`error` 是失败原因摘要。
        `proxy_used` / `proxy_failures` 记录本次运行是否实际用到代理以及代理失败次数，
        用于验证"直连失败后才回退代理"的策略是否生效。
      required:
        - id
        - judge
        - state
        - started_at
        - counts
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        state:
          $ref: '#/components/schemas/CrawlerRunState'
        trigger:
          $ref: '#/components/schemas/CrawlerRunTrigger'
        started_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
        finished_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: 运行结束时刻；仍在 `running` 时为 `null`。
        counts:
          $ref: '#/components/schemas/CrawlerRunCounts'
        proxy_used:
          type: boolean
          description: 本次运行是否至少有一次请求经由代理，即直连失败后发生了回退。
        proxy_failures:
          type: integer
          minimum: 0
          description: 本次运行中代理连接失败或被代理拒绝的次数。
          examples:
            - 0
        error:
          type: [string, 'null']
          description: 运行失败（`failed` / `partial`）时的原因摘要；成功时为 `null`。
          examples:
            - atcoder 第 3 页连续 5 次超时
        report_note:
          type: [string, 'null']
          description: 上报方附加的自由文本说明，例如 "手动补抓 2023 春季题单"。
          examples:
            - 手动补抓 2023 春季题单
      examples:
        - id: run_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          judge: codeforces
          state: partial
          trigger: schedule
          started_at: '2024-05-06T07:00:00.000Z'
          finished_at: '2024-05-06T07:03:20.000Z'
          counts:
            fetched: 120
            accepted: 96
            duplicates: 23
            rejected: 1
            failed: 0
          proxy_used: true
          proxy_failures: 0
          error: null
          report_note: null

    CrawlerRunReportRequest:
      type: object
      description: |
        **外部采集器**上报自己一次运行的请求体（`POST /crawler/runs`）。
        上报方必须给出该运行的自然身份信息（平台、状态、开始时刻与计数），
        `finished_at` 在 `state` 为终态时必填。

        该端点与 `POST /crawler/trigger`（服务器代管触发）是**两条互不影响的路**：
        前者不触发任何服务端采集，只登记运行记录；后者会真的让服务端去抓取。
      required:
        - judge
        - state
        - started_at
        - counts
      properties:
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        state:
          $ref: '#/components/schemas/CrawlerRunState'
          description: 本次运行结束时的状态；外部上报通常为 `succeeded`/`failed`/`partial`。
        trigger:
          $ref: '#/components/schemas/CrawlerRunTrigger'
          description: 外部采集器上报时通常为 `api`；省略时服务端记 `api`。
        started_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
        finished_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: 运行结束时刻；`state` 为终态时必填，否则应为 `null`。
        counts:
          $ref: '#/components/schemas/CrawlerRunCounts'
        proxy_used:
          type: boolean
          description: 本次运行是否至少有一次请求经由代理。
        proxy_failures:
          type: integer
          minimum: 0
          description: 本次运行中代理失败次数。
          examples:
            - 0
        error:
          type: [string, 'null']
          description: 失败原因摘要；成功时省略或为 `null`。
      examples:
        - judge: codeforces
          state: succeeded
          trigger: api
          started_at: '2024-05-06T07:00:00.000Z'
          finished_at: '2024-05-06T07:03:20.000Z'
          counts:
            fetched: 120
            accepted: 96
            duplicates: 23
            rejected: 1
            failed: 0
          proxy_used: false
          proxy_failures: 0
          error: null

    PagedCrawlerRun:
      description: 采集器运行记录的游标分页响应，固定按 `started_at` 倒序。
      allOf:
        - $ref: './common.yaml#/components/schemas/CursorPageMeta'
        - type: object
          required:
            - items
          properties:
            items:
              type: array
              description: 当前页的运行记录。
              items:
                $ref: '#/components/schemas/CrawlerRun'
      examples:
        - has_more: true
          next_cursor: eyJ0IjoiMjAyNC0wNS0wNlQwNzowMDowMC4wMDBaIiwiaWQiOiJydW5fMDFKOFo1VjZRMEszTTdOOVAyUjRUNlc4WDAifQ
          items:
            - id: run_01J8Z5V6Q0K3M7N9P2R4T6W8X0
              judge: codeforces
              state: succeeded
              trigger: schedule
              started_at: '2024-05-06T07:00:00.000Z'
              finished_at: '2024-05-06T07:03:20.000Z'
              counts:
                fetched: 120
                accepted: 96
                duplicates: 23
                rejected: 1
                failed: 0
              proxy_used: false
              proxy_failures: 0
              error: null
              report_note: null

    # ========================================================== 代管触发
    TriggerCrawlerRunRequest:
      type: object
      description: |
        请求服务器代管触发一次采集（`POST /crawler/trigger`）。仅在
        `GET /meta` 的 `capabilities.crawler_embedded = true`（`CrawlerConfig.mode =
        embedded`）时可用，否则返回 `409 crawler_not_embedded`；
        同一 `judge` 已有运行中的任务时返回 `409 crawler_run_in_progress`。
      required:
        - judge
      properties:
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        full:
          type: boolean
          default: false
          description: |
            是否执行全量回填：`true` 时忽略增量游标，从最早可见页开始抓取（代价高，
            仅用于首次接入或数据修复）；默认 `false` 只抓增量。
        since:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: |
            增量抓取的起点（只处理该时刻之后的提交）；省略时使用服务器为该平台
            记录的上次成功游标。与 `full: true` 同时给出时 `full` 优先。
      examples:
        - judge: codeforces
          full: false
          since: '2024-05-01T00:00:00.000Z'

    # ========================================================== 采集器状态
    JudgeCollectionStatus:
      type: object
      description: |
        单个平台的采集健康度。`lag` 是"已采集数据的最新时刻"与"当前时刻"之差
        （数据滞后），`consecutive_failures` 连续失败次数达到阈值时服务端会告警；
        该字段为 0 说明最近一次尝试成功。
      required:
        - judge
        - enabled
        - consecutive_failures
      properties:
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        enabled:
          type: boolean
          description: 该平台当前是否启用采集（来自 `CrawlerConfig.judges[]`）。
        last_attempt_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: 最近一次采集尝试的时刻；从未尝试为 `null`。
        last_success_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: 最近一次采集成功的时刻；从未成功为 `null`。
        lag:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Duration'
            - type: 'null'
          description: 数据滞后（已采集数据的最新时刻与当前时刻之差）；无数据为 `null`。
          examples:
            - PT12M
        consecutive_failures:
          type: integer
          minimum: 0
          description: 连续失败次数；成功一次即归零。
          examples:
            - 0
        last_error:
          type: [string, 'null']
          description: 最近一次失败的原因摘要；当前健康时为 `null`。
          examples:
            - 'ProxyError: 所有代理均不可用'
        using_proxy:
          type: boolean
          description: 最近一次尝试是否使用了代理，即直连失败并已回退。
        collected_24h:
          type: integer
          minimum: 0
          description: 最近 24 小时内采集入库的条目数。
          examples:
            - 512
      examples:
        - judge: codeforces
          enabled: true
          last_attempt_at: '2024-05-06T07:00:00.000Z'
          last_success_at: '2024-05-06T07:03:20.000Z'
          lag: PT12M
          consecutive_failures: 0
          last_error: null
          using_proxy: false
          collected_24h: 512

    CrawlerStatus:
      type: object
      description: |
        采集的实时状态快照：总体开关、调度时刻、各平台健康度、
        待处理条目与代理池概况。**最终一致视图**：由采集器心跳与 ingest 元数据聚合而来，
        可能滞后至多 `x-freshness-bound`；`generated_at` 是快照生成时刻。
      required:
        - mode
        - enabled
        - judges
        - pending_items
        - generated_at
      properties:
        mode:
          type: string
          description: 运行形态，与 `CrawlerConfig.mode` 一致（由服务器能力决定）。
          enum:
            - embedded
            - external
          examples:
            - embedded
        enabled:
          type: boolean
          description: 采集总开关的当前值。
        last_run_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: 最近一次采集运行（任意平台）的开始时刻；从未运行为 `null`。
        next_run_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: 调度器计划的下一次运行时刻；`mode=external` 或未启用时为 `null`。
        judges:
          type: array
          description: 各平台的采集健康度。
          items:
            $ref: '#/components/schemas/JudgeCollectionStatus'
        pending_items:
          type: integer
          minimum: 0
          description: 已接收但尚未在聚合视图中物化的条目数（0 表示统计已追平）。
          examples:
            - 0
        proxy_summary:
          oneOf:
            - type: object
              description: 代理池按健康状态汇总的数量。
              required:
                - healthy
                - unhealthy
                - unknown
              properties:
                healthy:
                  type: integer
                  minimum: 0
                  description: 健康代理数。
                  examples:
                    - 1
                unhealthy:
                  type: integer
                  minimum: 0
                  description: 不健康代理数。
                  examples:
                    - 0
                unknown:
                  type: integer
                  minimum: 0
                  description: 尚未探测或结果已过期的代理数。
                  examples:
                    - 1
            - type: 'null'
          description: 代理池健康度汇总；未配置任何代理时为 `null`。
        generated_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
      examples:
        - mode: embedded
          enabled: true
          last_run_at: '2024-05-06T07:00:00.000Z'
          next_run_at: '2024-05-06T07:32:00.000Z'
          judges:
            - judge: codeforces
              enabled: true
              last_attempt_at: '2024-05-06T07:00:00.000Z'
              last_success_at: '2024-05-06T07:03:20.000Z'
              lag: PT12M
              consecutive_failures: 0
              last_error: null
              using_proxy: false
              collected_24h: 512
          pending_items: 0
          proxy_summary:
            healthy: 1
            unhealthy: 0
            unknown: 1
          generated_at: '2024-05-06T07:05:00.000Z'
