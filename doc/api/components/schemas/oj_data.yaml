components:
  schemas:
    # ================================================================ OJ 绑定
    OjHandle:
      type: object
      description: |
        成员与某个 OJ 平台的 ID 绑定。`handle` 是外部平台的**原始账号名**，
        按普通字符串逐字保存（大小写敏感），不受内部 `Id` 模式约束。
        `revision` 用于乐观并发控制，值与 `ETag` 一致。

        `verification_token` 是归属校验用的秘密：**只有绑定所属主体本人，或持有
        `oj:manage` 的主体能看到明文，其它调用方一律看到 `null`**。

        `summary` 是采集结果的最终一致视图，见 `x-freshness-bound`，
        尚未采集到任何数据时为 `null`。

        `updated_at` 是该绑定的最近变更时刻，与 `revision` 递增同源：
        绑定创建/解绑、归属校验状态变化（`verify`）、采集补全字段与 `summary` 刷新
        都会推进它。`GET /oj-handles` 的 `updated_since` 增量同步以本字段为准。
      required:
        - id
        - principal_id
        - judge
        - handle
        - verified
        - verification_state
        - linked_at
        - revision
        - updated_at
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        principal_id:
          $ref: './common.yaml#/components/schemas/Id'
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        judge_label:
          type: [string, 'null']
          description: |
            `judge: other` 时必填的人类可读平台名，例如 `DMOJ`；其余情况为 `null`。
          maxLength: 64
          examples:
            - DMOJ
        handle:
          type: string
          description: 外部平台的原始账号名，逐字保存、大小写敏感。
          minLength: 1
          maxLength: 64
          examples:
            - tourist
        profile_url:
          type: [string, 'null']
          description: 该账号在外部平台的个人主页 URL；未知时为 `null`。
          examples:
            - https://codeforces.com/profile/tourist
        verified:
          type: boolean
          description: 归属校验是否通过；等价于 `verification_state == verified`。
        verification_state:
          type: string
          description: |
            归属校验状态机：`pending`（已发起，等待抓取到校验用提交或签名）
            → `verified`（校验通过，此后该绑定的采集数据计入成员统计）
            或 `failed`（超过有效期或校验串不匹配，可重新发起校验）。
            `failed` 可回到 `pending`；`verified` 一旦达成不会自动回退。
          enum:
            - pending
            - verified
            - failed
          examples:
            - verified
        verification_token:
          type: [string, 'null']
          description: |
            归属校验令牌（需写进 OJ 的签名/提交内容）。**仅本人或 `oj:manage` 可见**，
            其它调用方看到 `null`。`verified` 后服务端可保留或清空，客户端不得依赖其长期存在。
          examples:
            - xcv_7f3aQ0K3M7N9P2R4T6W8X0
        verified_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: 校验通过的时刻；未通过时为 `null`。
        linked_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
        last_crawled_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: 最近一次成功采集到该账号数据的时刻；从未采集为 `null`。
        last_submission_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: 已知最新一条提交的 `submitted_at`；无提交或未采集为 `null`。
        summary:
          oneOf:
            - $ref: '#/components/schemas/OjHandleSummary'
            - type: 'null'
          description: 该绑定的聚合统计摘要；尚未物化时为 `null`。
        revision:
          type: string
          description: 版本标记，与 `ETag` 值一致；写入时可用 `If-Match` 做乐观并发控制。
          examples:
            - '17'
        updated_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
          description: |
            该绑定的最近变更时刻，含 verify、重新抓取、`summary` 刷新，
            与 `revision` 递增同源；`GET /oj-handles` 的 `updated_since` 以它为准。
      examples:
        - id: ojh_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          principal_id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          judge: codeforces
          judge_label: null
          handle: tourist
          profile_url: https://codeforces.com/profile/tourist
          verified: true
          verification_state: verified
          verification_token: null
          verified_at: '2024-04-01T02:00:00.000Z'
          linked_at: '2024-03-20T08:00:00.000Z'
          last_crawled_at: '2024-05-06T07:00:00.000Z'
          last_submission_at: '2024-05-06T06:59:12.000Z'
          summary:
            rating: 3721
            max_rating: 3800
            rating_delta_30d: 42
            solved_count: 1873
            attempted_count: 2104
            submissions_30d: 96
            active_days_30d: 21
            computed_at: '2024-05-06T07:00:05.000Z'
          revision: '17'
          updated_at: '2024-05-06T07:00:05.000Z'

    OjHandleRef:
      type: object
      description: |
        OJ 绑定的轻量引用，用于在提交、rating 等记录里内联身份而不展开完整绑定。
      required:
        - id
        - judge
        - handle
        - verified
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        judge_label:
          type: [string, 'null']
          description: "`judge: other` 时的人类可读平台名；其余为 `null`。"
          examples:
            - DMOJ
        handle:
          type: string
          description: 外部平台的原始账号名。
          minLength: 1
          maxLength: 64
          examples:
            - tourist
        verified:
          type: boolean
          description: 该绑定是否已通过归属校验。
        latest_rating:
          type: [integer, 'null']
          description: 最近一次已知 rating；未知为 `null`。
          examples:
            - 3721
      examples:
        - id: ojh_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          judge: codeforces
          judge_label: null
          handle: tourist
          verified: true
          latest_rating: 3721

    OjHandleSummary:
      type: object
      description: |
        单个 OJ 绑定的聚合统计（由采集/物化任务计算，最终一致视图）。
        计数均以该绑定在服务器侧已采集的数据为准；`computed_at` 是聚合完成时刻，
        早于该时刻写入的原始记录可能尚未计入。
      required:
        - solved_count
        - attempted_count
        - computed_at
      properties:
        rating:
          type: [integer, 'null']
          description: 当前 rating（平台无 rating 体系时为 `null`）。
          examples:
            - 3721
        max_rating:
          type: [integer, 'null']
          description: 历史最高 rating。
          examples:
            - 3800
        rating_delta_30d:
          type: [integer, 'null']
          description: 最近 30 天 rating 净变化；数据不足时为 `null`。
          examples:
            - 42
        solved_count:
          type: integer
          minimum: 0
          description: 已解出的不同题目数（`accepted` 去重）。
          examples:
            - 1873
        attempted_count:
          type: integer
          minimum: 0
          description: 有提交记录的不同题目数，含未解出。
          examples:
            - 2104
        submissions_30d:
          type: integer
          minimum: 0
          description: 最近 30 天的提交条数。
          examples:
            - 96
        active_days_30d:
          type: integer
          minimum: 0
          description: 最近 30 天中有提交记录的天数。
          examples:
            - 21
        computed_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
      examples:
        - rating: 3721
          max_rating: 3800
          rating_delta_30d: 42
          solved_count: 1873
          attempted_count: 2104
          submissions_30d: 96
          active_days_30d: 21
          computed_at: '2024-05-06T07:00:05.000Z'

    # ================================================================== 题目
    OjProblemRef:
      type: object
      description: |
        题目的轻量引用。`external_id` 是**外部平台的原始题目编号**
        ，例如 Codeforces 的 `1873A`、洛谷的 `P1001`，普通字符串，不是内部 `Id`。
        自然键为 `(judge, external_id)`。
      required:
        - judge
        - external_id
      properties:
        problem_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Id'
            - type: 'null'
          description: 服务器侧题目资源的内部 id；题目尚未入库时为 `null`。
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        external_id:
          type: string
          description: 外部平台的原始题目编号，逐字保存、大小写敏感。
          minLength: 1
          maxLength: 128
          examples:
            - 1873A
        title:
          type: [string, 'null']
          description: 题目标题；采集器未提供时为 `null`。
          examples:
            - Short Sort
        url:
          type: [string, 'null']
          description: 题目在外部平台的 URL。
          examples:
            - https://codeforces.com/contest/1873/problem/A
        tags:
          type: array
          description: 平台标签或算法标签；未知时为空数组。
          items:
            type: string
          examples:
            - - brute force
              - implementation
        difficulty:
          type: [integer, 'null']
          description: 平台自身的难度分值（语义随平台而定）；未知为 `null`。
          examples:
            - 800
        rating:
          type: [integer, 'null']
          description: 平台自身的难度 rating，例如 Codeforces rating；未知为 `null`。
          examples:
            - 800
      examples:
        - problem_id: pbl_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          judge: codeforces
          external_id: 1873A
          title: Short Sort
          url: https://codeforces.com/contest/1873/problem/A
          tags:
            - brute force
            - implementation
          difficulty: 800
          rating: 800

    OjProblem:
      type: object
      description: |
        服务器侧保存的题目资源。`(judge, external_id)` 为自然键：同一自然键的重复
        ingest 不会新建资源，只会补全缺失字段。
        `first_seen_at` 是该题目首次被采集到的时刻，`updated_at` 是最后一次字段变更时刻，
        可用于 `updated_since` 增量同步。
      required:
        - id
        - judge
        - external_id
        - title
        - tags
        - first_seen_at
        - updated_at
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        external_id:
          type: string
          description: 外部平台的原始题目编号，逐字保存。
          minLength: 1
          maxLength: 128
          examples:
            - 1873A
        title:
          type: string
          description: 题目标题。
          minLength: 1
          maxLength: 300
          examples:
            - Short Sort
        url:
          type: [string, 'null']
          description: 题目在外部平台的 URL。
          examples:
            - https://codeforces.com/contest/1873/problem/A
        tags:
          type: array
          description: 平台标签或算法标签。
          items:
            type: string
          examples:
            - - implementation
        difficulty:
          type: [integer, 'null']
          description: 平台自身的难度分值；未知为 `null`。
          examples:
            - 800
        rating:
          type: [integer, 'null']
          description: 平台自身的难度 rating；未知为 `null`。
          examples:
            - 800
        solved_count:
          type: [integer, 'null']
          description: 服务器已知的、解出该题的不同绑定数；尚未物化时为 `null`。
          examples:
            - 12
        attempt_count:
          type: [integer, 'null']
          description: 服务器已知的、提交过该题的不同绑定数；尚未物化时为 `null`。
          examples:
            - 19
        first_seen_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
        updated_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
      examples:
        - id: pbl_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          judge: codeforces
          external_id: 1873A
          title: Short Sort
          url: https://codeforces.com/contest/1873/problem/A
          tags:
            - implementation
          difficulty: 800
          rating: 800
          solved_count: 12
          attempt_count: 19
          first_seen_at: '2024-04-01T02:00:00.000Z'
          updated_at: '2024-05-06T07:00:00.000Z'

    # ================================================================== 比赛
    OjContestRef:
      type: object
      description: |
        比赛（contest / 评测场次）的轻量引用。`contest_id` 是**外部平台的原始比赛编号**，
        普通字符串。自然键为 `(judge, contest_id)`。
      required:
        - judge
        - contest_id
      properties:
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        contest_id:
          type: string
          description: 外部平台的原始比赛编号，逐字保存。
          minLength: 1
          maxLength: 128
          examples:
            - '1873'
        name:
          type: [string, 'null']
          description: 比赛名称；未知为 `null`。
          examples:
            - Codeforces Round 898 (Div. 4)
        url:
          type: [string, 'null']
          description: 比赛页面 URL。
          examples:
            - https://codeforces.com/contest/1873
        started_at:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Timestamp'
            - type: 'null'
          description: 比赛开始时刻；未知为 `null`。
      examples:
        - judge: codeforces
          contest_id: '1873'
          name: Codeforces Round 898 (Div. 4)
          url: https://codeforces.com/contest/1873
          started_at: '2023-09-21T14:35:00.000Z'

    # ================================================================== 提交
    OjVerdict:
      type: string
      description: |
        归一化后的评测结果。各平台原始结果先映射到本枚举，无法归类的放入 `other`
        并在 `OjSubmission.verdict_raw` 里保留原文。`skipped` 表示被跳过，例如题目被移除。
      enum:
        - accepted
        - wrong_answer
        - time_limit_exceeded
        - memory_limit_exceeded
        - runtime_error
        - compile_error
        - presentation_error
        - partial
        - skipped
        - other
      examples:
        - accepted

    OjSubmission:
      type: object
      description: |
        一条 OJ 提交记录。自然键为 `(judge, submission_id)`，其中 `submission_id` 是
        **外部平台的原始提交编号**（普通字符串）。`ingested_at` 是服务器写入时刻，
        `submitted_at` 是平台上的提交时刻；补抓历史数据时前者可能远晚于后者。
        本结构只包含公开的 OJ 数据，不含手机号/学号等 PII。
      required:
        - id
        - judge
        - submission_id
        - handle
        - problem
        - submitted_at
        - ingested_at
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        submission_id:
          type: string
          description: 外部平台的原始提交编号，逐字保存，可能是数字或字符串形式。
          minLength: 1
          maxLength: 128
          examples:
            - '223456789'
        handle:
          type: string
          description: 提交者的 OJ 账号名（外部平台原始值）。
          minLength: 1
          maxLength: 64
          examples:
            - tourist
        principal_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Id'
            - type: 'null'
          description: |
            若该 `handle` 已与某个主体绑定，则为其 id；未绑定或绑定未通过校验时为 `null`。
        problem:
          $ref: '#/components/schemas/OjProblemRef'
        verdict:
          oneOf:
            - $ref: '#/components/schemas/OjVerdict'
            - type: 'null'
          description: 归一化评测结果，取值见 `OjVerdict`；平台尚未给出结果时为 `null`。
        verdict_raw:
          type: [string, 'null']
          description: 平台原始评测结果文本，便于排障与后续重新归一化。
          examples:
            - OK
        language:
          type: [string, 'null']
          description: 提交语言（平台原始写法，如 `GNU C++17`）。
          examples:
            - GNU C++17
        submitted_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
        ingested_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
        contest:
          oneOf:
            - $ref: '#/components/schemas/OjContestRef'
            - type: 'null'
          description: 所属比赛；练习提交（不在比赛中）为 `null`。
        is_first_ac:
          type: boolean
          description: |
            是否是该 `(judge, handle, problem)` 的首次 `accepted`。
            由服务器按自然键判定，采集器上报的同名字段仅作提示。
      examples:
        - id: sub_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          judge: codeforces
          submission_id: '223456789'
          handle: tourist
          principal_id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          problem:
            problem_id: pbl_01J8Z5V6Q0K3M7N9P2R4T6W8X0
            judge: codeforces
            external_id: 1873A
            title: Short Sort
            url: https://codeforces.com/contest/1873/problem/A
            tags:
              - implementation
            difficulty: 800
            rating: 800
          verdict: accepted
          verdict_raw: OK
          language: GNU C++17
          submitted_at: '2024-05-06T06:59:12.000Z'
          ingested_at: '2024-05-06T07:01:00.000Z'
          contest:
            judge: codeforces
            contest_id: '1873'
            name: Codeforces Round 898 (Div. 4)
            url: https://codeforces.com/contest/1873
            started_at: '2023-09-21T14:35:00.000Z'
          is_first_ac: true

    # ============================================================ rating 记录
    OjRatingRecord:
      type: object
      description: |
        **一次 rating 观测**（一个历史点）。原始数据只有"某时刻的 rating"：
        采集器给出 `judge` / `handle` / `rating` / `at` 即可，**不需要 `delta`**——
        `delta` 由服务端与同一 `judge`+`handle` 的**上一条**记录相减派生（首条为
        `null`），`rank` / `performance` / `max_rating` 也只在平台提供时才存在。

        自然键：带 `contest_id` 时用 `(judge, handle, contest_id)`（同场次重复上报
        不会产生第二条记录），否则退化为 `(judge, handle, at)`。
      required:
        - id
        - judge
        - handle
        - rating
        - at
      properties:
        id:
          $ref: './common.yaml#/components/schemas/Id'
        judge:
          $ref: './common.yaml#/components/schemas/Judge'
        handle:
          type: string
          description: OJ 账号名（外部平台原始值）。
          minLength: 1
          maxLength: 64
          examples:
            - tourist
        principal_id:
          oneOf:
            - $ref: './common.yaml#/components/schemas/Id'
            - type: 'null'
          description: 已绑定的主体 id；未绑定时为 `null`。
        contest:
          oneOf:
            - $ref: '#/components/schemas/OjContestRef'
            - type: 'null'
          description: 触发本次变化的比赛；平台未提供时为 `null`。
        rating:
          type: integer
          description: 该时刻的 rating（观测值本身，独立成立）。
          examples:
            - 3721
        delta:
          type:
            - integer
            - 'null'
          description: |
            与同一 `judge`+`handle` **上一条**记录的 `rating` 之差，可为负；首条为
            `null`。这是**服务端派生**的展示字段，不是上报的必需数据。
          examples:
            - 42
        max_rating:
          type: [integer, 'null']
          description: 该时刻的历史最高 rating（若平台提供）；未知为 `null`。
          examples:
            - 3800
        rank:
          type: [integer, 'null']
          description: 本场名次；未知为 `null`。
          examples:
            - 7
        performance:
          type: [integer, 'null']
          description: 本场表现分（performance）；平台无该概念时为 `null`。
          examples:
            - 3810
        at:
          $ref: './common.yaml#/components/schemas/Timestamp'
        ingested_at:
          $ref: './common.yaml#/components/schemas/Timestamp'
      examples:
        - id: rch_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          judge: codeforces
          handle: tourist
          principal_id: acc_01J8Z5V6Q0K3M7N9P2R4T6W8X0
          contest:
            judge: codeforces
            contest_id: '1873'
            name: Codeforces Round 898 (Div. 4)
            url: https://codeforces.com/contest/1873
            started_at: '2023-09-21T14:35:00.000Z'
          rating: 3721
          delta: 42
          max_rating: 3800
          rank: 7
          performance: 3810
          at: '2023-09-21T16:35:00.000Z'
          ingested_at: '2024-05-06T07:01:00.000Z'

    # ============================================================ 账号快照
    OjHandleStats:
      description: |
