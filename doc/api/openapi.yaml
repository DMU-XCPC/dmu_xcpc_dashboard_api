jsonSchemaDialect: https://json-schema.org/draft/2020-12/schema

externalDocs:
  description: 主服务器 API 设计与时序说明
  url: https://github.com/dmu-xcpc/dmu_xcpc_dashboard_api/blob/main/doc/api/README.md

servers:
  - url: /api/v1
    description: 同源部署（推荐；前端、机器人、采集器与 API 走同一域名）
  - url: https://{host}/api/v1
    description: 独立域名部署
    variables:
      host:
        default: dashboard.dmu.edu.cn
        description: 面板部署主机名

tags:
  - name: auth
    description: 登录、令牌刷新、登出与当前主体。
  - name: accounts
    description: |
      **账号与权限，以"身份"为中心**：创建主体、停用与启用、标签与 `资源:动作` scope
      列表、签发与撤销凭证。典型场景是给 QQ 机器人发 API Key、停用某个账号、
      查某主体拥有哪些权限。
      **查人、筛人、填表档案、活跃度请用 `members`**，那是同一主体的另一视角，见 README §3.1。
  - name: credentials
    description: 会话令牌与机器人 API Key 的查看、撤销。
  - name: oj-handles
    description: 成员绑定 OJ ID：绑定、解绑、归属校验。
  - name: oj-data
    description: 采集结果的公开查询：提交记录、rating 变化、题目与账号统计。
  - name: members
    description: |
      **成员名单，以"人"为中心**：查社团名单、按年级/专业/队伍/是否成员筛人、批量导入、
      看活跃度、改档案、分配标签与 scope。典型场景是开学导名单、按年级出填表清单、
      看谁最近没在训练、赛季组队。
      **创建账号、停用、发凭证、配权限请用 `accounts`**，见 README §3.1。
  - name: teams
    description: 队伍与分组管理，用于按队伍聚合的榜单与名额认领。
  - name: roster
    description: 成员名单导出，异步执行。支持 CSV 与 JSON，默认排除超过 1 年未活跃的成员。
  - name: ingest
    description: 采集器写入通道：提交记录、rating 变化、账号快照、题目的幂等批量上报。
  - name: crawler
    description: 采集器配置，含网络失败后的代理服务器回退与运行状态；也支持服务端代管触发。
  - name: scoreboards
    description: 不同分组的 scoreList：定义、排名条目、条目历史与重建。
  - name: stats
    description: |
      训练统计：随时间的变化趋势、按日热力图、分档直方图与总览数字。
      **只出数字，不出名次**；需要排名与榜单请用 `scoreboards`。
  - name: announcements
    description: 新闻板/公告：起草、发布、定时、置顶、广播与投递记录。
  - name: channels
    description: 广播渠道配置与连通性测试，支持 QQ 群与 Webhook。
  - name: stream
    description: SSE 实时事件流与短时流令牌，覆盖公告、榜单与采集进度。
  - name: quotas
    description: 区域赛等名额池：管理员设置名额、队伍认领、管理员审核。
  - name: config
    description: 服务器参数配置。文件用 TOML 或 YAML，也可在运行时通过接口修改；不支持 XML。
  - name: sync
    description: 增量变更游标，供二次开发与离线缓存同步本地数据库。
  - name: audit
    description: 审计日志查询。
  - name: ops
    description: 健康检查、元信息、指标与异步任务。

