openapi: 3.1.0

info:
  title: DMU/ICPC Dashboard API
  version: 1.0.0
  summary: 校队信息面板主服务器对外提供的 RESTful API
  description: |
    DMU/ICPC 集训队信息面板**主服务器**的 HTTP 契约。本目录下的 OpenAPI 文档是
    唯一事实源，服务端实现、前端与各语言客户端都以它对齐。

    **名词不认识时**先看 `README.md` 的「0.1 术语速查」：主体、成员、社团身份、scope、
    标签、幂等键、ETag/revision、游标分页、物化聚合、名额认领、SSE 等都在那里一句话
    解释清楚。**想按任务找端点**看那里的「2.1 按任务找端点」。

    约定、实体、语义与**时序行为**见 `README.md`；编写规范见 `STYLE.md`。
    本文档只描述主服务器。外部采集器、QQ/Agent 机器人与前端都是契约的调用方。

    ## 模块一览

    | 模块 | 说明 |
    | --- | --- |
    | `auth` | 登录、令牌刷新、登出、当前主体 |
    | `accounts` | 账号与权限：创建主体、停用、标签与 scope、凭证签发 |
    | `credentials` | 查看与撤销凭证：会话令牌、长期 API Key |
    | `oj-handles` | 成员与 OJ ID 的绑定与归属校验 |
    | `oj-data` | 采集结果的公开查询：提交记录、rating 记录、题目、统计 |
    | `members` | 成员名单：查人筛人、填表档案、批量导入、活跃度 |
    | `teams` | 队伍与分组 |
    | `roster` | 成员名单导出，异步任务，默认排除一年未活跃者 |
    | `ingest` | 采集器写入通道，幂等批量上报 |
    | `crawler` | 采集器配置、运行状态与运行记录、代管触发 |
    | `scoreboards` | 榜单 scoreList：定义、条目与历史 |
    | `stats` | 训练 trend、热力图、直方图与总览 |
    | `announcements` | 新闻板与公告：起草、发布、定时、置顶、广播 |
    | `channels` | 广播渠道配置与测试 |
    | `stream` | SSE 实时事件流与短时流令牌 |
    | `quotas` | 名额池、认领与审核 |
    | `config` | 参数配置的读取与运行时修改 |
    | `sync` | 增量变更游标，供二次开发与离线缓存 |
    | `audit` | 审计日志 |
    | `ops` | 健康检查、元信息、指标、异步任务 |

    ### 先看这里：`/members` 与 `/accounts` 怎么选

    两者是同一个主体的两个入口，共享同一个 id 与 `ETag`。按你要做的事选：

    | 你要做的事 | 用 |
    | --- | --- |
    | 查社团名单、按年级/专业/队伍/是否成员筛人、批量导入、看活跃度、改档案 | `members` |
    | 建账号、停用、设 scope、签发或撤销 API Key、查权限 | `accounts` 与 `credentials` |

    口诀：管"人"用 `members`，管"身份与访问"用 `accounts`。
    完整对照见 `doc/api/README.md` §3.1，按任务找全部端点的索引见 §2.1。

    ## 通用约定

    - 基础路径 `/api/v1`。破坏性变更走 `/api/v2`，不原地修改。
    - JSON，字段 `snake_case`。时间为 UTC RFC 3339，例如 `2024-05-06T07:08:09.123Z`。
    - 错误响应统一 RFC 7807 `application/problem+json`，并带机器可读的 `code`。
    - 认证用 `Authorization: Bearer <token>` 或 `X-API-Key`。SSE 另用短时流令牌。
    - 列表分页用 `page`/`size`；大流量只读集合用游标 `cursor`/`limit`。
    - 写操作幂等：携带 `Idempotency-Key`，重放返回相同结果并标注
      `Idempotency-Replayed: true`。
    - 条件请求：`ETag` 配 `If-None-Match` 读缓存，`If-Match` 配 `revision` 做并发控制。
    - 增量同步：列表与 `GET /sync/changes` 支持 `updated_since` 游标。
    - 限流：响应带 `X-RateLimit-*`，超限返回 `429` 与 `Retry-After`。
    - 长任务返回 `202` 与 `Location`，客户端按 `Retry-After` 轮询 `GET /jobs/{job_id}`。
    - 每个响应都带 `X-Request-Id`，与错误体的 `request_id` 一致。
    - 完整时序见 `README.md`。每个操作的 `x-idempotent`、`x-consistency` 与
      `x-freshness-bound` 扩展给出机器可读提示。
  contact:
    name: DMU XCPC Dev Group
    url: https://github.com/dmu-xcpc/dmu_xcpc_dashboard_api
  license:
    name: MIT
    identifier: MIT

