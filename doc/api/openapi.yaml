components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: opaque
      description: |
        不透明凭证：人类使用 `POST /auth/login` 返回的会话令牌，
        机器人/采集器使用管理员签发的长期 API Key。服务端存储、可撤销、可设过期。
    apiKeyAuth:
      type: apiKey
      in: header
      name: X-API-Key
      description: 与 `bearerAuth` 等价的便捷写法，便于只支持自定义头的机器人。
    streamTokenAuth:
      type: apiKey
      in: query
      name: access_token
      description: |
        仅用于 `GET /stream/events`。由 `POST /stream/tokens` 签发，有效期不超过 10 分钟。
        浏览器 `EventSource` 无法设置请求头，因此把令牌放在查询参数里。
